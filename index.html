<style>
:root{--g1:#14532d;--g2:#166534;--g3:#22c55e;--y:#facc15;--bg:#eef3ee;--bg2:#e3ece4;--card:#fff;--tx:#10231a;--mu:#5b6f64;--bd:#d6e2d9;--rd:#dc2626;--or:#d97706;--bl:#2563eb;--sh:0 1px 1px rgba(16,35,26,.06),0 4px 8px rgba(16,35,26,.06),0 14px 28px rgba(16,35,26,.08);--sh2:0 2px 2px rgba(16,35,26,.08),0 10px 20px rgba(16,35,26,.12),0 30px 50px rgba(16,35,26,.14)}
[data-theme=dark]{--bg:#0b1510;--bg2:#101d16;--card:#15251c;--tx:#e8f2ea;--mu:#90a799;--bd:#25382d;--sh:0 1px 1px rgba(0,0,0,.4),0 6px 12px rgba(0,0,0,.35),0 18px 36px rgba(0,0,0,.4);--sh2:0 2px 2px rgba(0,0,0,.5),0 14px 26px rgba(0,0,0,.5),0 36px 60px rgba(0,0,0,.55)}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh;background-image:radial-gradient(900px 500px at 10% -10%,rgba(34,197,94,.14),transparent),radial-gradient(700px 400px at 100% 0,rgba(250,204,21,.10),transparent);background-attachment:fixed}
h1,h2,h3{margin:0}h3{font-size:15px}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:linear-gradient(180deg,#0f3d22,#14532d 60%,#0f3d22);color:#e8f5ec;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;z-index:30;box-shadow:6px 0 24px rgba(0,0,0,.18)}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}
.brand img{width:42px;height:42px;border-radius:12px;background:#fff;object-fit:contain;padding:3px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.brand b{display:block;font-size:17px;letter-spacing:.5px}.brand small{opacity:.7;font-size:11px;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;color:#cfe5d6;text-decoration:none;cursor:pointer;transition:.2s}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:linear-gradient(180deg,#2a7a47,#1d6a3a);color:#fff;transform:translateY(-2px) translateZ(0);box-shadow:0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);font-weight:700}
.sfoot .btn{color:#10231a;justify-content:center}.sfoot{padding:10px 6px 0;font-size:11px;color:#a9c9b4;display:flex;flex-direction:column;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.top h2{font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-size:12px;font-weight:600;cursor:default;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--bd);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--bd);transition:.12s}
.ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--bd)}
.menub{display:none}
.view{padding:18px;flex:1;max-width:1300px;width:100%}
.view>*{animation:rise .5s both}
.view>*:nth-child(2){animation-delay:.06s}.view>*:nth-child(3){animation-delay:.12s}.view>*:nth-child(4){animation-delay:.18s}.view>*:nth-child(5){animation-delay:.24s}.view>*:nth-child(n+6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.foot{padding:14px 18px 20px;display:flex;justify-content:flex-end;color:var(--mu);font-size:11px;font-weight:600;border-top:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);transition:box-shadow .25s,transform .25s;position:relative;min-width:0}
.tilt{transition:transform .15s ease-out,box-shadow .25s;will-change:transform}
.tilt:hover{box-shadow:var(--sh2)}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:.2s;background:radial-gradient(260px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.28),transparent 60%)}
.tilt:hover::after{opacity:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:600;box-shadow:0 3px 0 var(--bd),0 6px 10px rgba(0,0,0,.05);transition:.12s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--bd)}
.btn.pri{background:linear-gradient(180deg,#2f9a5a,#1f7a44);color:#fff;border-color:#166534;box-shadow:0 3px 0 #0f4a28,0 8px 14px rgba(22,101,52,.35)}
.btn.pri:active{box-shadow:0 0 0 #0f4a28}
.btn.dg{color:var(--rd)}.btn.sm{padding:5px 9px;font-size:12px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.ph{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-size:22px}.ph p{margin:2px 0 0;color:var(--mu);font-size:12.5px}
input,select{width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--bd);background:var(--card);outline:none;box-shadow:inset 0 2px 3px rgba(0,0,0,.05)}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{flex:1 1 150px}.bar .btn{flex:none}

table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mu);padding:10px 12px;background:var(--bg2);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--bd);vertical-align:middle}
tbody tr{transition:.15s}tbody tr:hover{background:var(--bg2);box-shadow:inset 3px 0 0 var(--g3)}
td.act{white-space:nowrap;text-align:right}
.bd{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.bd.ok{background:#dcfce7;color:#166534}.bd.wa{background:#fef3c7;color:#92400e}.bd.er{background:#fee2e2;color:#991b1b}.bd.in{background:#dbeafe;color:#1e40af}
[data-theme=dark] .bd.ok{background:#14532d;color:#bbf7d0}[data-theme=dark] .bd.wa{background:#713f12;color:#fde68a}[data-theme=dark] .bd.er{background:#7f1d1d;color:#fecaca}[data-theme=dark] .bd.in{background:#1e3a8a;color:#bfdbfe}
.qrs{width:34px;height:34px;border-radius:4px;background:#fff;padding:2px;display:block}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.stat{color:#fff;border:0;overflow:hidden}
.stat small{opacity:.9;font-weight:600}.stat b{display:block;font-size:30px;margin-top:4px}
.stat::before{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18)}
.s1{background:linear-gradient(135deg,#f59e0b,#f97316)}.s2{background:linear-gradient(135deg,#3b82f6,#2563eb)}.s3{background:linear-gradient(135deg,#10b981,#059669)}.s4{background:linear-gradient(135deg,#ef4444,#be123c)}
.hero{background:linear-gradient(135deg,#14532d,#1d7a42 60%,#2a9d57);color:#fff;border-radius:22px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;overflow:hidden;position:relative;box-shadow:var(--sh2)}
.hero h1{font-size:22px}.hero p{margin:6px 0 0;opacity:.85}
.scene{perspective:700px;display:flex;gap:26px;padding:6px 18px;transform-style:preserve-3d;flex:none}
.b3{width:54px;height:76px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite;transform:rotateX(-14deg)}
.b3.bb2{animation-duration:12s;animation-direction:reverse;margin-top:14px}.b3.bb3{animation-duration:15s}
@keyframes spin{to{transform:rotateX(-14deg) rotateY(360deg)}}

.b3 .fr,.b3 .bk{width:54px;height:76px;background:var(--c1,#facc15);border-radius:3px}
.b3 .fr{transform:translateZ(13px);background:linear-gradient(135deg,var(--c1,#facc15),var(--c2,#f59e0b))}

.b3 .lf{transform:rotateY(-90deg) translateZ(27px);background:var(--c2,#f59e0b)}.b3 .rt{transform:rotateY(90deg) translateZ(27px)}
.b3 .tp,.b3 .bt{width:54px;height:26px;top:25px;background:#f1f5f9}
.b3 .tp{transform:rotateX(90deg) translateZ(38px)}.b3 .bt{transform:rotateX(-90deg) translateZ(38px)}

canvas.ch{width:100%;height:230px;display:block}
.fl{display:block;margin-bottom:11px}.fl span{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--mu)}.rq{color:var(--rd)}
.ov{position:fixed;inset:0;background:rgba(5,15,10,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:14px;perspective:1000px;animation:fade .2s}

.dlg{background:var(--card);border-radius:20px;width:100%;max-width:460px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh2);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}

.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.db{padding:16px;overflow:auto}.df{display:flex;gap:8px;justify-content:flex-end;padding-top:6px}

.tst{background:#10231a;color:#fff;padding:10px 16px;border-radius:14px;box-shadow:var(--sh2);animation:pop .45s cubic-bezier(.2,1.4,.4,1);font-weight:600;font-size:13px}.tst.err{background:#991b1b}.tst.ok{background:#166534}
.mcard{width:100%;max-width:430px;aspect-ratio:1.586;border-radius:18px;background:#fff;color:#10231a;overflow:hidden;box-shadow:var(--sh2);display:flex;flex-direction:column;margin:0 auto;border:1px solid #d6e2d9;position:relative}
.mcard .mh{background:linear-gradient(135deg,#14532d,#1f7a44);color:#fff;padding:9px 12px;display:flex;gap:9px;align-items:center}
.mcard .mh img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
.mcard .mh b{display:block;font-size:12px}.mcard .mh small{font-size:9.5px;opacity:.85;display:block}

.drop{border:2px dashed var(--bd);border-radius:16px;padding:22px;text-align:center;color:var(--mu);cursor:pointer;transition:.2s}

.kv{display:flex;gap:8px;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}
.rank{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
.rank .no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--bg2)}.rank .no.g{background:linear-gradient(135deg,#fde047,#f59e0b);color:#5b3a00;box-shadow:0 3px 6px rgba(245,158,11,.5)}
.pg{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pg .btn.on{background:var(--g2);color:#fff}
.muted{color:var(--mu)}.small{font-size:12px}.mt{margin-top:14px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;perspective:1000px}
.lcard{width:100%;max-width:380px;text-align:center;padding:26px 22px}

.hero2{border-radius:26px;padding:22px 20px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:radial-gradient(420px 260px at 92% 0%,rgba(250,204,21,.24),transparent 70%),linear-gradient(160deg,#1f7a44,#0f3d22 72%);box-shadow:var(--sh2);display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}

@keyframes sway{0%,100%{transform:rotateX(-8deg) rotateY(-32deg) translateY(0)}50%{transform:rotateX(-8deg) rotateY(16deg) translateY(-10px)}}

.bk .f em{position:relative;writing-mode:vertical-rl;font-style:normal;font-weight:800;font-size:16px;letter-spacing:.34em;color:#efc95f;border:2px solid #efc95f;border-radius:6px;padding:16px 8px}

.bk .t{width:100%;height:var(--d);top:calc(50% - var(--d) / 2);transform:rotateX(90deg) translateZ(calc(var(--h) / 2));background:linear-gradient(180deg,#fbfaf2,#e2dec9)}
.bk .u{width:100%;height:var(--d);top:calc(50% - var(--d) / 2);transform:rotateX(-90deg) translateZ(calc(var(--h) / 2));background:#b9b6a2}

.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.tabs button{padding:8px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--card);font-weight:700;cursor:pointer;color:var(--mu);font-family:inherit}.tabs button.on{background:var(--g2);color:#fff;border-color:var(--g2)}

<body>
<div id="login" hidden></div>
<div id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><img id="blogo" alt=""><div><b>PUSTAKA</b><small id="bnama"></small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot"><div id="stinfo"></div><button class="btn sm" id="pwabtn" hidden></button><button class="btn sm" data-act="logout"></button></div>
  </aside>
  <div class="main">
    <header class="top"><button class="ib menub" data-act="menu" aria-label="Menu"></button><h2 id="ttl"></h2><span class="dot" id="dot" title="Status koneksi"></span><span class="chip" id="usr"></span><button class="ib" data-act="theme" aria-label="Tema"></button></header>
    <main class="view" id="view"></main>
    <footer class="foot">Design by Akhmad Fitra Harry, S.Pd</footer>
  </div>
</div>
<div id="modal"></div><div id="toast"></div>
<script>
'use strict';
/* ========== utilitas ========== */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>s?String(s).split('-').reverse().join('-'):'–';
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const nat=(a,b)=>String(a).localeCompare(String(b),'id',{numeric:true,sensitivity:'base'});
const IC={home:'M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z',scan:'M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M4 12h16',layers:'M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5',tag:'M3 12V4h8l10 10-8 8L3 12zM7.5 7.5h.01',book:'M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5zM4 19a2 2 0 012-2h13',repeat:'M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3',users:'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8',upload:'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12',clock:'M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2',file:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M8 13h8M8 17h8',shield:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',menu:'M3 6h18M3 12h18M3 18h18',plus:'M12 5v14M5 12h14',trash:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',edit:'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z',print:'M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z',download:'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3',sun:'M12 17a5 5 0 100-10 5 5 0 000 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4',moon:'M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z',x:'M18 6L6 18M6 6l12 12',qr:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v3M14 20h3M20 20h1',alert:'M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01',out:'M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9'};
Object.assign(IC,{login:'M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3',clipboard:'M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2M9 2h6v4H9zM9 14l2 2 4-4',award:'M12 15a6 6 0 100-12 6 6 0 000 12zM8.2 13.9L7 22l5-3 5 3-1.2-8.1'});
const ICON=(n,s=17)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`;
const DEFAULT_LOGO='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#166534"/><path d="M50 30c-8-5-18-6-28-4v40c10-2 20-1 28 4 8-5 18-6 28-4V26c-10-2-20-1-28 4z" fill="#fff"/><path d="M50 30v40" stroke="#166534" stroke-width="3"/><circle cx="50" cy="20" r="4" fill="#facc15"/></svg>');
const book3d=c=>`<div class="b3 ${c}"><i class="f fr"></i><i class="f bk"></i><i class="f lf"></i><i class="f rt"></i><i class="f tp"></i><i class="f bt"></i></div>`;

/* ========== pustaka luar (dimuat saat dibutuhkan) ========== */
const LIBS={qr:'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',h5:'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',fb1:'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',fb2:'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',fb3:'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'};
const _lp={};
function ensure(k){return _lp[k]||(_lp[k]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=LIBS[k];s.onload=ok;s.onerror=()=>{delete _lp[k];no(new Error('Gagal memuat pustaka ('+k+'). Periksa koneksi internet.'))};document.head.appendChild(s)}))}

/* ========== data ========== */
const COLS=['kelas','kategori','buku','anggota','pinjaman','petugas','riwayat','cacah','kegiatan','survei','berkas'];
const S={db:{kelas:[],kategori:[],buku:[],anggota:[],pinjaman:[],petugas:[],riwayat:[],kunjungan:[],cacah:[],kegiatan:[],survei:[],berkas:[],set:{}},user:null,page:'dashboard',scan:{a:null,b:null},ps:{},imp:null};
const FBC=window.PUSTAKA_FIREBASE||{};
const USE_FB=!!(FBC.apiKey&&FBC.projectId);
const LS='pustaka_db_v1';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)Object.assign(S.db,d)}catch(e){}}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S.db))}catch(e){toast('Penyimpanan penuh atau diblokir peramban','err')}}
function defaults(){S.db.set=Object.assign({nama:'Nama Sekolah Anda',alamat:'',kepala:'',hari:7,logo:'',diatur:false,rombel:'',jam:{},kepsek:'',nipKepsek:'',nipKepala:'',npp:'',cek:{}},S.db.set||{});[...COLS,'kunjungan'].forEach(c=>{if(!Array.isArray(S.db[c]))S.db[c]=[]})}
const set=()=>S.db.set;
const logo=()=>set().logo||DEFAULT_LOGO;
async function put(col,o){const a=S.db[col],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else if(col==='riwayat')a.unshift(o);else a.push(o);if(USE_FB)await fbPut(col,o);else persist()}
async function putMany(col,arr){const a=S.db[col],m=new Map(a.map((x,i)=>[x.id,i]));arr.forEach(o=>{if(m.has(o.id))a[m.get(o.id)]=o;else{m.set(o.id,a.length);a.push(o)}});if(USE_FB)await fbPutMany(col,arr);else persist()}
async function del(col,id){const old=S.db[col].find(x=>x.id===id);S.db[col]=S.db[col].filter(x=>x.id!==id);if(USE_FB)await fbDel(col,id,old);else persist()}
async function delAll(col){const ids=col==='kunjungan'?[...new Set(S.db[col].map(x=>x.tgl))]:S.db[col].map(x=>x.id);S.db[col]=[];if(USE_FB){for(let i=0;i<ids.length;i+=400){const b=S.fs.batch();ids.slice(i,i+400).forEach(id=>b.delete(S.fs.collection(col).doc(id)));await b.commit()}}else persist()}
async function saveSet(p){Object.assign(S.db.set,p);if(USE_FB)await S.fs.collection('meta').doc('sekolah').set(S.db.set);else persist()}
function log(aksi,detail){return put('riwayat',{id:uid(),waktu:new Date().toISOString(),petugas:S.user?S.user.nama:'-',aksi,detail:detail||''}).catch(()=>{})}
const kn=id=>(S.db.kelas.find(x=>x.id===id)||{}).nama||'–';
const cn=id=>(S.db.kategori.find(x=>x.id===id)||{}).nama||'–';
const bukuBy=id=>S.db.buku.find(x=>x.id===id);
const angBy=id=>S.db.anggota.find(x=>x.id===id);
const activeLoans=()=>{const m=new Map();S.db.pinjaman.forEach(p=>{if(!p.tglKembali)m.set(p.bukuId,p)});return m};
const isLate=p=>!p.tglKembali&&p.tenggat<today();
const stBadge=l=>!l?'<span class="bd ok">Tersedia</span>':isLate(l)?'<span class="bd er">Terlambat</span>':'<span class="bd wa">Dipinjam</span>';
const kelasSorted=()=>[...S.db.kelas].sort((a,b)=>nat(a.nama,b.nama));
const kategoriSorted=()=>[...S.db.kategori].sort((a,b)=>nat(a.nama,b.nama));
const opts=(arr,ph)=>[['',ph],...arr.map(x=>[x.id,x.nama])];

/* ========== antarmuka dasar ========== */
function toast(m,t){const e=document.createElement('div');e.className='tst '+(t||'');e.textContent=m;$('#toast').appendChild(e);setTimeout(()=>e.remove(),t==='err'?5000:2600)}
function modal(title,body,wide){$('#modal').innerHTML=`<div class="ov"><div class="dlg ${wide?'wide':''}" role="dialog"><div class="dh"><h3>${title}</h3><button class="ib" data-act="close" aria-label="Tutup">${ICON('x')}</button></div><div class="db">${body}</div></div></div>`}
function closeModal(){$('#modal').innerHTML=''}
function formModal(title,fields,vals,onSave){
  const h=fields.map(f=>{const v=vals[f.k]??'';let i;
    if(f.t==='select')i=`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else i=`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.r?'required':''} ${f.dl?`list="dl_${f.k}"`:f.list?`list="${f.list}"`:''} ${f.m?`maxlength="${f.m}"`:''} autocomplete="off">`;
    return `<label class="fl"><span>${f.l}${f.r?' <b class="rq">*</b>':''}</span>${i}${f.dl?`<datalist id="dl_${f.k}">${f.dl.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}</label>`}).join('');
  modal(title,`<form id="frm">${h}<div class="df"><button type="button" class="btn" data-act="close">Batal</button><button class="btn pri">Simpan</button></div></form>`);
  $('#frm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{if(await onSave(d)!==false)closeModal()}catch(er){toast(er.message||'Gagal menyimpan','err')}};
  setTimeout(()=>{const f=$('#frm input,#frm select');if(f)f.focus()},60)
}
const tbl=(heads,rows,empty)=>`<div class="tw"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${heads.length}" class="muted" style="text-align:center;padding:28px">${empty||'Belum ada data.'}</td></tr>`}</tbody></table></div>`;
const PS=25;
function paginate(arr,key){const st=S.ps[key];const n=Math.max(1,Math.ceil(arr.length/PS));if(st.p>n)st.p=n;return arr.slice((st.p-1)*PS,st.p*PS)}
function pager(total,key){const n=Math.ceil(total/PS);if(n<=1)return '';const p=S.ps[key].p;let h='';for(let i=1;i<=n;i++){if(n>9&&Math.abs(i-p)>2&&i!==1&&i!==n){if(h.slice(-3)!=='…')h+='<span>…</span>';continue}h+=`<button class="btn sm ${i===p?'on':''}" data-act="pg" data-k="${key}" data-p="${i}">${i}</button>`}return `<div class="pg">${h}</div>`}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
const csvCell=v=>{v=String(v??'');return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
async function exportRows(name,rows,asXlsx){if(asXlsx){try{await ensure('xlsx');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Data');XLSX.writeFile(wb,name+'.xlsx');return}catch(e){toast('Excel tidak bisa dibuat, diganti CSV','err')}}download(name+'.csv',toCSV(rows),'text/csv')}
function printHTML(title,body){const w=window.open('','_blank');if(!w){toast('Peramban memblokir jendela cetak. Izinkan pop-up lalu coba lagi.','err');return}

const qrCache=new Map();
function qrData(t,size=200){const k=t+'|'+size;if(qrCache.has(k))return qrCache.get(k);let u='';try{const d=document.createElement('div');new QRCode(d,{text:String(t),width:size,height:size,correctLevel:QRCode.CorrectLevel.M});const c=d.querySelector('canvas');u=c?c.toDataURL():(d.querySelector('img')||{}).src||''}catch(e){}if(u)qrCache.set(k,u);return u}
const qrImg=(t,c)=>{const u=qrData(t);return u?`<img class="${c||'q'}" src="${u}" alt="QR ${esc(t)}">`:`<span class="muted small">QR tidak termuat</span>`};
function cardHTML(a){return `<div class="mcard tilt"><div class="mh"><img src="${esc(logo())}" alt=""><div><b>Kartu Anggota Perpustakaan</b><small>${esc(set().nama)}</small></div></div><div class="mb">${qrImg(a.nisn)}<dl><dt>${a.tipe&&a.tipe!=='Siswa'?'NIP / ID':'NISN'}</dt><dd>${esc(a.nisn)}</dd><dt>Nama</dt><dd>${esc(a.nama)}</dd><dt>${a.tipe&&a.tipe!=='Siswa'?'Tipe':'Kelas'}</dt><dd>${esc(kelasLabel(a))}</dd><dt>TTL</dt><dd>${esc([a.tempat,fmt(a.tgl)].filter(x=>x&&x!=='–').join(', ')||'–')}</dd><dt>Jenis Kelamin</dt><dd>${esc(a.jk||'–')}</dd></dl></div><div class="mf"></div></div>`}
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function cardPNG(a){const W=856,H=540,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#14532d');g.addColorStop(1,'#1f7a44');x.fillStyle=g;x.fillRect(0,0,W,120);

  const q=await loadImg(qrData(a.nisn,300));if(q)x.drawImage(q,40,160,250,250);
  const rows=[[a.tipe&&a.tipe!=='Siswa'?'NIP / ID':'NISN',a.nisn],['Nama',a.nama],[a.tipe&&a.tipe!=='Siswa'?'Tipe':'Kelas',kelasLabel(a)],['TTL',[a.tempat,fmt(a.tgl)].filter(v=>v&&v!=='–').join(', ')||'–'],['Jenis Kelamin',a.jk||'–']];
  rows.forEach((r,i)=>{x.fillStyle='#5b6f64';x.font='20px Arial';x.fillText(r[0],320,190+i*52);x.fillStyle='#10231a';x.font='700 25px Arial';x.fillText(String(r[1]),320,218+i*52,500)});
  const g2=x.createLinearGradient(0,0,W,0);g2.addColorStop(0,'#facc15');g2.addColorStop(1,'#22c55e');x.fillStyle=g2;x.fillRect(0,H-22,W,22);

const dark=()=>document.documentElement.dataset.theme==='dark';
function setupCanvas(c){const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);const x=c.getContext('2d');if(!x)return null;x.scale(dpr,dpr);return{x,w:r.width,h:r.height}}

    x.fillStyle=hot?'#16a34a':'#22c55e';x.fillRect(bx,by,bw,bh);
    x.fillStyle=hot?'#86efac':'#4ade80';x.beginPath();x.moveTo(bx,by);x.lineTo(bx+d,by-d);x.lineTo(bx+bw+d,by-d);x.lineTo(bx+bw,by);x.fill();
    x.fillStyle=hot?'#166534':'#15803d';x.beginPath();x.moveTo(bx+bw,by);x.lineTo(bx+bw+d,by-d);x.lineTo(bx+bw+d,by+bh-d);x.lineTo(bx+bw,by+bh);x.fill();

function drawPie(c,data,hv){if(!c)return;try{const s=setupCanvas(c);if(!s)return;const{x,w,h}=s;x.clearRect(0,0,w,h);const tot=data.reduce((a,b)=>a+b[1],0);if(!tot)return;
  const fg=dark()?'#e8f2ea':'#10231a',items=data.map(d=>({l:d[0],n:String(d[1]),pc:'('+Math.round(100*d[1]/tot)+'%)',c:d[2]}));

  const wl=meas(),gap=22,tw=wl.reduce((a,b)=>a+b,0)+gap*(items.length-1),stack=tw>w-8,lh=stack?items.length*24+8:40;
  const dp=28,avail=h-lh-8,rx=Math.min(w*.42,(avail-dp-12)/1.25),ry=rx*.62,cx=w/2,cy=ry+10;
  const sl=[];let a0=-Math.PI/2;data.forEach((d,i)=>{const a1=a0+Math.PI*2*d[1]/tot;sl.push([a0,a1,d,i]);a0=a1});c._g={cx,cy,rx,ry,sl};

  x.fillStyle='rgba(0,0,0,.14)';x.beginPath();x.ellipse(cx+5,cy+dp+12,rx*1.02,ry*1.03,0,0,7);x.fill();
  const draw=(dy,k,stroke)=>sl.forEach(([p,q,d,i])=>{if(d[1]===0)return;const off=hv===i?-7:0;x.fillStyle=shade(d[2],k);x.beginPath();x.moveTo(cx,cy+dy+off);x.ellipse(cx,cy+dy+off,rx,ry,0,p,q);x.closePath();x.fill();if(stroke){x.strokeStyle='#fff';x.lineWidth=2.5;x.stroke()}});
  for(let k=dp;k>0;k-=2)draw(k,.55,false);draw(0,1,true);
  const g=x.createRadialGradient(cx-rx*.35,cy-ry*.45,4,cx,cy,rx);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill();
  x.font='800 19px Plus Jakarta Sans,Arial';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=4;
  sl.forEach(([p,q,d,i])=>{const pc=d[1]/tot;if(pc<.06)return;const am=(p+q)/2,off=hv===i?-7:0;x.fillText(Math.round(pc*100)+'%',cx+Math.cos(am)*rx*.58,cy+Math.sin(am)*ry*.58+off)});
  x.shadowBlur=0;x.textBaseline='alphabetic';
  const drawItem=(it,lx,ly)=>{x.fillStyle=it.c;x.beginPath();x.roundRect?x.roundRect(lx,ly-12,15,15,4):x.rect(lx,ly-12,15,15);x.fill();x.textAlign='left';x.fillStyle=fg;x.font='14px Plus Jakarta Sans,Arial';x.fillText(it.l,lx+22,ly);let o=lx+22+x.measureText(it.l).width+8;x.font='800 14px Plus Jakarta Sans,Arial';x.fillText(it.n,o,ly);o+=x.measureText(it.n).width+8;x.font='14px Plus Jakarta Sans,Arial';x.fillStyle=dark()?'#90a799':'#5b6f64';x.fillText(it.pc,o,ly)};
  if(stack){const bw=Math.max(...wl),lx0=Math.max(8,(w-bw)/2);items.forEach((it,i)=>drawItem(it,lx0,cy+ry+dp+34+i*24))}
  else{let lx=Math.max(4,(w-tw)/2);const ly=h-18;items.forEach((it,i)=>{drawItem(it,lx,ly);lx+=wl[i]+gap})}
  if(!c._h){c._h=1;c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),G=c._g,px=e.clientX-r.left-G.cx,py=(e.clientY-r.top-G.cy)/(G.ry/G.rx);let i=-1;if(Math.hypot(px,py)<=G.rx){let a=Math.atan2(py,px);if(a<-Math.PI/2)a+=Math.PI*2;i=G.sl.findIndex(z=>a>=z[0]&&a<z[1])}if(i!==c._hi){c._hi=i;drawPie(c,data,i)}});c.addEventListener('mouseleave',()=>{c._hi=-1;drawPie(c,data,-1)})}}catch(e){console.warn(e)}}

const TUJUAN=['Membaca','Meminjam / mengembalikan','Belajar / mengerjakan tugas','Mencari informasi','Lainnya'];
const HARI=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const fmtLong=s=>{const p=String(s||'').split('-').map(Number);return p.length===3?p[2]+' '+BLN[p[1]-1]+' '+p[0]:'–'};
const toMin=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
const cnt=(arr,fn)=>{const m={};arr.forEach(x=>{const k=fn(x);m[k]=(m[k]||0)+1});return m};
const sortCnt=m=>Object.entries(m).sort((a,b)=>b[1]-a[1]||nat(a[0],b[0]));
function beep(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?880:220;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{try{o.stop();c.close()}catch(e){}},ok?120:320)}catch(e){}}
function bindEnter(i,fn){if(!i)return;i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=i.value.trim();i.value='';if(v)fn(v)}})}

const ttdHTML=()=>{const s=set();const nm=(n,nip)=>`<b><u>${esc(n||'..............................')}</u></b>${nip?'<br>NIP. '+esc(nip):''}`;return `<div class="ttd"><div>Mengetahui,<br>Kepala Sekolah<br><br><br><br>${nm(s.kepsek,s.nipKepsek)}</div><div>${fmtLong(today())}<br>Kepala Perpustakaan<br><br><br><br>${nm(s.kepala,s.nipKepala)}</div></div>`};
function printDoc(title,body,opt){const w=window.open('','_blank');if(!w){toast('Peramban memblokir jendela cetak. Izinkan pop-up lalu coba lagi.','err');return}
  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;font-size:12px;color:#000;margin:0}h2{margin:12px 0 2px;font-size:15px;text-align:center}h3{margin:14px 0 6px;font-size:13px}p{margin:0 0 8px}.kop{display:flex;gap:12px;align-items:center;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:6px}.kop img{width:62px;height:62px;object-fit:contain}.kop b{font-size:16px}.kop div{line-height:1.35}.sub{text-align:center;margin-bottom:10px}table{border-collapse:collapse;width:100%;margin-bottom:6px}th,td{border:1px solid #666;padding:3px 6px;text-align:left;vertical-align:top}th{background:#e8efe9;-webkit-print-color-adjust:exact;print-color-adjust:exact}.tw{border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}.card{border:1px solid #666;padding:5px 8px}.card small{color:#444}.ttd{display:flex;justify-content:space-between;margin-top:26px;text-align:center;break-inside:avoid}.ttd>div{width:45%}img.q{width:36px;height:36px}.note{font-size:10px;color:#444;margin-top:10px}@page{size:A4 ${opt&&opt.land?'landscape':'portrait'};margin:14mm}</style>${kopHTML()}<h2>${esc(title)}</h2>${body}`);
  w.document.close();w.focus();setTimeout(()=>w.print(),600)}
async function exportSheets(name,sheets,xlsx){if(xlsx){try{await ensure('xlsx');const wb=XLSX.utils.book_new();sheets.forEach(s=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s.rows),s.name.slice(0,31)));XLSX.writeFile(wb,name+'.xlsx');return}catch(e){toast('Excel tidak bisa dibuat, diganti CSV','err')}}
  const rows=[];sheets.forEach(s=>{rows.push([s.name]);rows.push(...s.rows);rows.push([])});download(name+'.csv',toCSV(rows),'text/csv')}

/* ========== Laporan bulanan / tahunan ========== */
const lapTabs=()=>{const t=S.ps.lap.tab;return `<div class="tabs no-print"><button class="${t==='rincian'?'on':''}" data-act="lptab" data-t="rincian">Rincian Peminjaman</button><button class="${t==='periodik'?'on':''}" data-act="lptab" data-t="periodik">Laporan Bulanan / Tahunan</button></div>`};
function periodRange(){const f=S.ps.lap;if(f.pm==='tahun'){const y=+f.thn||new Date().getFullYear();return{from:y+'-01-01',to:y+'-12-31',label:'Tahun '+y,y,tahun:true}}
  const p=(f.bln||today().slice(0,7)).split('-').map(Number),y=p[0],m=p[1],last=new Date(y,m,0).getDate();return{from:y+'-'+pad(m)+'-01',to:y+'-'+pad(m)+'-'+pad(last),label:BLN[m-1]+' '+y,y,m,tahun:false}}
function periodData(){const r=periodRange(),K=S.db.kunjungan.filter(k=>k.tgl>=r.from&&k.tgl<=r.to),P=S.db.pinjaman.filter(p=>p.tglPinjam>=r.from&&p.tglPinjam<=r.to&&bukuBy(p.bukuId)),B=S.db.buku,A=B.filter(aktif);
  const late=p=>p.tglKembali?p.tglKembali>p.tenggat:p.tenggat<today();
  const kel=k=>k.kelasId?kn(k.kelasId):(k.anggotaId?'–':'Tamu');
  const judul={};P.forEach(p=>{const b=bukuBy(p.bukuId),k=tkey(b);(judul[k]=judul[k]||{j:b.judul,n:0}).n++});
  const pem={};P.forEach(p=>{pem[p.anggotaId]=(pem[p.anggotaId]||0)+1});
  const bln=[];if(r.tahun)for(let m=1;m<=12;m++){const k=r.y+'-'+pad(m);bln.push([BLN[m-1],K.filter(x=>x.tgl.startsWith(k)).length,P.filter(x=>x.tglPinjam.startsWith(k)).length])}
  const jenis=[...JENIS,''].map(j=>{const l=A.filter(b=>(b.jenis||'')===j);return[j||'(jenis belum diisi)',judulSet(l).size,l.length]}).filter(x=>x[2]);
  const add=r.tahun?A.filter(b=>String(b.tahunPerolehan)===String(r.y)):[];
  return{r,K,P,hari:new Set(K.map(k=>k.tgl)).size,kKelas:sortCnt(cnt(K,kel)),kTuj:sortCnt(cnt(K,k=>k.tujuan||'–')),kJK:cnt(K,k=>k.jk||'–'),
    pKelas:sortCnt(cnt(P,p=>{const a=angBy(p.anggotaId);return a?kn(a.kelasId):'–'})),pKat:sortCnt(cnt(P,p=>cn(bukuBy(p.bukuId).kategoriId))),
    topJudul:Object.values(judul).sort((a,b)=>b.n-a.n||nat(a.j,b.j)).slice(0,10),topAng:Object.entries(pem).map(([id,n])=>({a:angBy(id),n})).filter(x=>x.a).sort((a,b)=>b.n-a.n||nat(a.a.nama,b.a.nama)).slice(0,10),
    kembali:P.filter(p=>p.tglKembali).length,telat:P.filter(late).length,bln,jenis,
    kond:cnt(B,kondOf),judulTot:judulSet(A).size,eks:A.length,ang:S.db.anggota.length,add:add.length,addJ:judulSet(add).size,
    siang:B.filter(b=>kondOf(b)==='Disiangi'&&b.tglSiang>=r.from&&b.tglSiang<=r.to).length}}
function periodHTML(d){const kpi=(l,v)=>`<div class="card"><small class="muted">${l}</small><b style="font-size:22px;display:block">${typeof v==='number'?fmtN(v):v}</b></div>`;
  const t=(h,rows,e)=>tbl(h,rows.map(x=>`<tr>${x.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join(''),e||'Belum ada data pada periode ini.');

  <h3 class="mt">Kunjungan</h3>${jk?`<p class="small">Menurut jenis kelamin: ${esc(jk)}</p>`:''}<div class="grid g2"><div>${t(['Kelas','Kunjungan'],d.kKelas)}</div><div>${t(['Tujuan','Kunjungan'],d.kTuj)}</div></div>
  <h3 class="mt">Peminjaman</h3><div class="grid g2"><div>${t(['Kelas','Peminjaman'],d.pKelas)}</div><div>${t(['Kategori','Peminjaman'],d.pKat)}</div></div>
  <h3 class="mt">Buku paling sering dipinjam</h3>${t(['No','Judul','Dipinjam'],d.topJudul.map((x,i)=>[i+1,x.j,x.n]))}

  <h3 class="mt">Koleksi menurut jenis</h3>${t(['Jenis','Judul','Eksemplar'],d.jenis,'Belum ada data koleksi.')}<p class="small muted">Kondisi seluruh koleksi: ${KONDISI.map(k=>k+' '+(d.kond[k]||0)).join(' · ')}</p>
  ${d.r.tahun?`<h3 class="mt">Per bulan</h3>${t(['Bulan','Kunjungan','Peminjaman'],d.bln)}`:''}`}
function periodSheets(d){const kv=a=>[...a.map(x=>[x[0],x[1]])];

async function kunjunganCode(code){code=String(code||'').trim();if(!code)return;
  const a=S.db.anggota.find(x=>String(x.nisn)===code);
  if(a&&a.lulus){kjMsg('err','<b>'+esc(a.nama)+'</b><small>Anggota sudah lulus.</small>');return}
  if(!a){kjMsg('err','Kode tidak dikenali: <b>'+esc(code)+'</b><small>Pastikan yang dipindai adalah kartu anggota.</small>');return}
  const tuj=($('#kjtuj')||{}).value||'Membaca',now=Date.now(),dup=S.db.kunjungan.find(k=>k.anggotaId===a.id&&k.tgl===today()&&now-(k.ts||0)<300000);
  if(dup){kjMsg('dup','<b>'+esc(a.nama)+'</b><small>Sudah tercatat pukul '+esc(dup.jam)+'. Tidak dicatat ganda.</small>');return}
  try{const o=await addKunj(a,tuj);kjMsg('ok','<b>'+esc(a.nama)+'</b> · '+esc(kn(a.kelasId))+'<small>Tercatat pukul '+esc(o.jam)+'</small>');kjRender()}catch(e){kjMsg('err',esc(fbErr(e)))}}

/* ========== Penyimpanan Firebase untuk kunjungan ========== */
const FV=()=>firebase.firestore.FieldValue;
async function fbPut(col,o){if(col==='kunjungan')return S.fs.collection('kunjungan').doc(o.tgl).set({items:FV().arrayUnion(o)},{merge:true});return S.fs.collection(col).doc(o.id).set(o)}
async function fbPutMany(col,arr){if(col==='kunjungan'){const m={};arr.forEach(o=>(m[o.tgl]=m[o.tgl]||[]).push(o));for(const [d,its] of Object.entries(m))for(let i=0;i<its.length;i+=200)await S.fs.collection('kunjungan').doc(d).set({items:FV().arrayUnion(...its.slice(i,i+200))},{merge:true});return}
  for(let i=0;i<arr.length;i+=400){const b=S.fs.batch();arr.slice(i,i+400).forEach(o=>b.set(S.fs.collection(col).doc(o.id),o));await b.commit()}}
async function fbDel(col,id,old){if(col==='kunjungan'){if(!old)return;const r=S.fs.collection('kunjungan').doc(old.tgl);return S.fs.runTransaction(async t=>{const s=await t.get(r);if(!s.exists)return;t.set(r,{items:(s.data().items||[]).filter(x=>x.id!==id)})})}return S.fs.collection(col).doc(id).delete()}

function bukuNorm(o,bad){const j=normJenis(o.jenis);if(j===null)bad('jenis koleksi tidak dikenali (pilih: '+JENIS.join(', ')+')');else o.jenis=j;
  const k=normKond(o.kondisi);if(k===null)bad('kondisi harus Baik, Rusak, Hilang, atau Disiangi');else o.kondisi=k;
  const y=normYear(o.tahunPerolehan);if(y===null)bad('tahun perolehan tidak valid');else o.tahunPerolehan=y;
  o.sumber=normSumber(o.sumber);o.ddc=String(o.ddc||'').trim().replace(',','.')}
const normJenis=v=>{const s=norm(v);if(!s)return '';const m={fiksi:'Fiksi',nonfiksi:'Nonfiksi',referensi:'Referensi',bukuteks:'Buku Teks',teks:'Buku Teks',terbitanberkala:'Terbitan Berkala',berkala:'Terbitan Berkala',majalah:'Terbitan Berkala',alatperaga:'Alat Peraga',peraga:'Alat Peraga'};return m[s]||null};
const normKond=v=>{const s=norm(v);if(!s)return '';if(s==='baik')return 'Baik';if(/^rusak/.test(s))return 'Rusak';if(s==='hilang')return 'Hilang';if(/^disiang/.test(s))return 'Disiangi';return null};
const normTipe=v=>{const s=norm(v);if(!s)return '';if(s==='siswa'||s==='murid')return 'Siswa';if(s==='guru')return 'Guru';if(/^(tendik|tenagakependidikan|staf|staff|karyawan)$/.test(s))return 'Tenaga Kependidikan';return null};
const normYear=v=>{const s=String(v||'').trim();if(!s)return '';return /^(19|20)\d\d$/.test(s)?s:null};
const normSumber=v=>{const s=String(v||'').trim();if(!s)return '';const m=SUMBER.find(x=>norm(x)===norm(s));return m||s};

const nextKelasName=n=>{const m=/^(\D*)(\d+)(.*)$/.exec(n);return m?m[1]+(+m[2]+1)+m[3]:null};
function naikDefault(k){const nx=nextKelasName(k.nama),t=nx&&S.db.kelas.find(x=>x.nama.toLowerCase()===nx.toLowerCase());if(t)return t.id;const m=/(\d+)/.exec(k.nama);if(!m)return '=';const mx=Math.max(...S.db.kelas.map(x=>+((/(\d+)/.exec(x.nama)||[])[1]||0)));return +m[1]>=mx?'lulus':'='}
S.ps.naik={};
PAGES.naik=()=>{const ks=kelasSorted(),last=set().naikLast;
  const rows=ks.map(k=>{const n=S.db.anggota.filter(a=>isSiswa(a)&&!a.lulus&&a.kelasId===k.id).length,v=S.ps.naik[k.id]||naikDefault(k);
    return `<tr><td><b>${esc(k.nama)}</b></td><td>${n} siswa</td><td><select data-naik="${k.id}" aria-label="Tujuan ${esc(k.nama)}"><option value="=" ${v==='='?'selected':''}>Tetap di kelas ini</option>${ks.filter(x=>x.id!==k.id).map(x=>`<option value="${x.id}" ${v===x.id?'selected':''}>Naik ke ${esc(x.nama)}</option>`).join('')}<option value="lulus" ${v==='lulus'?'selected':''}>Lulus / keluar</option></select></td></tr>`}).join('');
  return ph('Kenaikan Kelas','Pindahkan siswa satu kelas ke kelas berikutnya sekaligus, dan tandai kelas akhir sebagai lulus.',last?`<button class="btn" data-act="naikundo">Urungkan kenaikan terakhir (${fmt(last.tgl)})</button>`:'')+
  `<div class="alert"><span>Lakukan di awal tahun ajaran, setelah data kelas benar. Tujuan sudah diisi otomatis dari nama kelas; periksa dulu. Siswa yang lulus tetap tersimpan (riwayat pinjam utuh) tetapi tidak bisa meminjam atau tercatat berkunjung. Sebelum menerapkan, unduh cadangan di menu Admin.</span></div>`+tbl(['Kelas','Jumlah','Tujuan'],rows,'Belum ada kelas.')+`<div class="row mt"><button class="btn pri" data-act="naikdo">${ICON('layers',15)} Terapkan kenaikan kelas</button></div>`};
async function naikDo(){const ks=kelasSorted(),moves=[],undo=[];let nl=0,nn=0;
  ks.forEach(k=>{const v=S.ps.naik[k.id]||naikDefault(k);if(v==='=')return;S.db.anggota.filter(a=>isSiswa(a)&&!a.lulus&&a.kelasId===k.id).forEach(a=>{undo.push([a.id,a.kelasId,0]);if(v==='lulus'){moves.push({...a,lulus:true,tahunLulus:today().slice(0,4)});nl++}else{moves.push({...a,kelasId:v});nn++}})});
  if(!moves.length)return toast('Tidak ada siswa yang dipindahkan','err');
  if(!confirm('Pindahkan '+nn+' siswa ke kelas berikutnya dan luluskan '+nl+' siswa? Anda bisa mengurungkan sekali sesudahnya.'))return;
  try{await putMany('anggota',moves);await saveSet({naikLast:{tgl:today(),items:undo}});await log('Kenaikan kelas',nn+' naik, '+nl+' lulus');S.ps.naik={};toast('Kenaikan kelas selesai: '+nn+' naik, '+nl+' lulus','ok');go('naik')}catch(e){toast(fbErr(e),'err')}}
async function naikUndo(){const l=set().naikLast;if(!l||!confirm('Kembalikan semua siswa ke kelas sebelum kenaikan tanggal '+fmt(l.tgl)+'? Perubahan data setelah itu pada siswa terkait ikut tertimpa.'))return;
  const m=new Map(l.items.map(x=>[x[0],x]));const back=S.db.anggota.filter(a=>m.has(a.id)).map(a=>({...a,kelasId:m.get(a.id)[1],lulus:false,tahunLulus:''}));
  try{await putMany('anggota',back);await saveSet({naikLast:null});await log('Kenaikan kelas','Diurungkan');toast('Kenaikan kelas diurungkan','ok');go('naik')}catch(e){toast(fbErr(e),'err')}}

const waNum=v=>{let d=String(v||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return d.length>=10&&d.length<=15?d:''};
const lateDays=p=>Math.max(1,Math.round((new Date(today()+'T00:00:00')-new Date(p.tenggat+'T00:00:00'))/864e5));
const waText=p=>{const a=angBy(p.anggotaId),b=bukuBy(p.bukuId),m={sekolah:set().nama,nama:a.nama,kelas:kelasLabel(a),judul:b.judul,tenggat:fmtLong(p.tenggat),hari:lateDays(p)};return (set().tplWA||WA_TPL).replace(/\{(\w+)\}/g,(x,k)=>m[k]!==undefined?m[k]:x)};
const tlList=()=>[...activeLoans().values()].filter(p=>isLate(p)&&angBy(p.anggotaId)&&bukuBy(p.bukuId)&&(!S.ps.tl.kelas||angBy(p.anggotaId).kelasId===S.ps.tl.kelas)).sort((a,b)=>a.tenggat.localeCompare(b.tenggat));
function tlTable(){const L=tlList();return `<p class="muted small">${L.length} buku terlambat</p>`+tbl(['Peminjam','Buku','Tenggat','Terlambat','Pengingat',''],L.map(p=>{const a=angBy(p.anggotaId),b=bukuBy(p.bukuId),n=waNum(a.hp);
    return `<tr><td><b>${esc(a.nama)}</b><div class="muted small">${esc(kelasLabel(a))}</div></td><td>${esc(b.judul)}<div class="muted small">${esc(b.kode)}</div></td><td>${fmt(p.tenggat)}</td><td><span class="bd er">${lateDays(p)} hari</span></td><td>${p.diingatkan?'<span class="bd in">'+fmt(p.diingatkan)+'</span>':'<span class="muted small">Belum</span>'}</td><td class="act">${n?`<a class="btn sm pri" data-act="wasent" data-id="${p.id}" href="https://wa.me/${n}?text=${encodeURIComponent(waText(p))}" target="_blank" rel="noopener">WhatsApp</a>`:`<button class="btn sm" data-act="aedit" data-id="${a.id}" title="Isi nomor WhatsApp">+ Nomor</button>`} <button class="btn sm" data-act="wacopy" data-id="${p.id}">Salin pesan</button></td></tr>`}).join(''),'Tidak ada buku yang terlambat.')}
PAGES.terlambat=()=>ph('Buku Terlambat','Daftar buku yang lewat tenggat, lengkap dengan pesan WhatsApp siap kirim ke orang tua atau guru.',`<button class="btn" data-act="watpl">Ubah teks pesan</button><button class="btn pri" data-act="tlprint">${ICON('print',15)} Cetak per kelas</button>`)+`<div class="bar no-print"><select data-f="tl:kelas">${opts(kelasSorted(),'Semua kelas').map(o=>`<option value="${o[0]}" ${o[0]===S.ps.tl.kelas?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div><div id="list">${tlTable()}</div>`;
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Pesan disalin','ok')}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('Pesan disalin','ok')}catch(e2){toast('Tidak bisa menyalin','err')}x.remove()}}
function tlPrint(){const L=tlList();if(!L.length)return toast('Tidak ada buku terlambat','err');const g={};L.forEach(p=>{const k=kelasLabel(angBy(p.anggotaId));(g[k]=g[k]||[]).push(p)});
  printDoc('Daftar Buku Belum Dikembalikan',`<p class="sub">Per ${fmtLong(today())}</p>`+Object.keys(g).sort(nat).map(k=>`<h3>${esc(k)}</h3>`+tbl(['No','Nama','Judul','Kode','Tenggat','Terlambat'],g[k].map((p,i)=>`<tr><td>${i+1}</td><td>${esc(angBy(p.anggotaId).nama)}</td><td>${esc(bukuBy(p.bukuId).judul)}</td><td>${esc(bukuBy(p.bukuId).kode)}</td><td>${fmt(p.tenggat)}</td><td>${lateDays(p)} hari</td></tr>`).join(''))).join('')+ttdHTML())}
function waTplForm(){modal('Teks pesan WhatsApp',`<form id="frm"><p class="small muted">Gunakan {nama}, {kelas}, {judul}, {tenggat}, {hari}, {sekolah}. Nomor ditulis seperti 08123456789.</p><label class="fl"><span>Teks pesan</span><textarea name="t" rows="6" style="width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:inherit;font:inherit">${esc(set().tplWA||WA_TPL)}</textarea></label><div class="df"><button type="button" class="btn" id="tplr">Kembalikan bawaan</button><button type="button" class="btn" data-act="close">Batal</button><button class="btn pri">Simpan</button></div></form>`);
  $('#tplr').onclick=()=>{$('#frm textarea').value=WA_TPL};$('#frm').onsubmit=async e=>{e.preventDefault();try{await saveSet({tplWA:new FormData(e.target).get('t').trim()||WA_TPL});closeModal();go('terlambat')}catch(er){toast(fbErr(er),'err')}}}

/* ========== Label punggung & label QR ========== */
function callNo(b){const pen=(String(b.pengarang||b.judul||'').normalize('NFD').replace(/[^A-Za-z]/g,'').slice(0,3)).toUpperCase(),jd=String(b.judul||'').trim().charAt(0).toLowerCase();return [b.jenis==='Referensi'?'R':'',b.ddc||'–',pen,jd].filter(x=>x!=='')}
function labelForm(){const L=bukuFiltered();if(!L.length)return toast('Tidak ada buku pada tampilan ini','err');
  modal('Cetak Label',`<form id="frm"><p class="small">Label untuk <b>${fmtN(Math.min(L.length,600))} eksemplar</b> sesuai pencarian dan filter saat ini${L.length>600?' (dibatasi 600 per cetak)':''}.</p><label class="fl"><span>Jenis label</span><select name="m"><option value="punggung">Label punggung (nomor panggil: DDC, 3 huruf pengarang, huruf judul)</option><option value="qr">Label kode QR (kode, QR, judul)</option></select></label><div class="df"><button type="button" class="btn" data-act="close">Batal</button><button class="btn pri">Cetak</button></div></form>`);
  $('#frm').onsubmit=e=>{e.preventDefault();printLabels(L.slice(0,600),new FormData(e.target).get('m'));closeModal()}}
function printLabels(L,m){const w=window.open('','_blank');if(!w){toast('Peramban memblokir jendela cetak. Izinkan pop-up lalu coba lagi.','err');return}
  const body=m==='qr'?L.map(b=>`<div class="lq"><img src="${qrData(b.kode,200)}" alt=""><div><b>${esc(b.kode)}</b><small>${esc(b.inv||'')}</small><span>${esc(b.judul)}</span></div></div>`).join(''):L.map(b=>`<div class="lb">${callNo(b).map(x=>`<div>${esc(x)}</div>`).join('')}</div>`).join('');
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Label ${m==='qr'?'QR':'punggung'}</title><style>body{font-family:Arial,sans-serif;margin:0;color:#000}.g{display:flex;flex-wrap:wrap;gap:2mm}.lb{width:30mm;height:38mm;border:1px dashed #888;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:12pt;line-height:1.35;text-align:center;break-inside:avoid;overflow:hidden}.lq{width:62mm;height:26mm;border:1px dashed #888;box-sizing:border-box;display:flex;gap:2mm;align-items:center;padding:2mm;break-inside:avoid;overflow:hidden}.lq img{width:22mm;height:22mm;flex:none}.lq div{display:flex;flex-direction:column;min-width:0}.lq b{font-size:11pt}.lq small{font-size:8pt}.lq span{font-size:8pt;line-height:1.2;max-height:2.4em;overflow:hidden}@page{size:A4;margin:8mm}</style><div class="g">${body}</div>`);
  w.document.close();w.focus();setTimeout(()=>w.print(),600)}

/* ========== Katalog (OPAC) ========== */
S.ps.opac={q:'',jenis:'',kat:''};
function opacGroups(arr){const lo=activeLoans(),m=new Map();arr.forEach(b=>{const k=tkey(b);let g=m.get(k);if(!g){g={b,n:0,av:0,yr:0,pop:0,ids:new Set()};m.set(k,g)}g.n++;g.ids.add(b.id);if(!lo.has(b.id)&&kondOf(b)==='Baik')g.av++;g.yr=Math.max(g.yr,+b.tahunPerolehan||0)});
  S.db.pinjaman.forEach(p=>{const b=bukuBy(p.bukuId);if(!b)return;const g=m.get(tkey(b));if(g)g.pop++});return [...m.values()]}
const opacCard=g=>`<div class="opr"><div style="min-width:0"><b>${esc(g.b.judul)}</b><div class="small muted">${esc(g.b.pengarang||'Pengarang tidak dicatat')}${g.b.tahun?' · '+esc(g.b.tahun):''}</div><div class="small" style="margin-top:4px">${g.b.jenis?`<span class="bd in">${esc(g.b.jenis)}</span> `:''}${g.b.kategoriId?esc(cn(g.b.kategoriId)):''}${g.b.ddc?' · DDC '+esc(g.b.ddc):''}</div></div><div>${g.av?`<span class="bd ok">Tersedia ${g.av} dari ${g.n}</span>`:'<span class="bd wa">Sedang dipinjam</span>'}</div></div>`;
function opacList(){const f=S.ps.opac,q=sq(f.q),A=S.db.buku.filter(aktif);
  if(!q&&!f.jenis&&!f.kat){const G=opacGroups(A),nw=[...G].sort((a,b)=>b.yr-a.yr||nat(a.b.judul,b.b.judul)).slice(0,8),pp=[...G].filter(g=>g.pop).sort((a,b)=>b.pop-a.pop).slice(0,8);
    return `<p class="muted small">${fmtN(G.length)} judul dalam katalog. Ketik judul, pengarang, atau topik di atas.</p><div class="grid g2"><div><h3>Koleksi terbaru</h3>${nw.map(opacCard).join('')||'<p class="muted small">Belum ada koleksi.</p>'}</div><div><h3>Paling sering dipinjam</h3>${pp.map(opacCard).join('')||'<p class="muted small">Belum ada data peminjaman.</p>'}</div></div>`}
  const R=opacGroups(A.filter(b=>(!f.jenis||b.jenis===f.jenis)&&(!f.kat||b.kategoriId===f.kat)&&(!q||[b.judul,b.pengarang,b.ddc,b.subjenis,b.jenis,cn(b.kategoriId)].some(v=>sq(v).includes(q))))).sort((a,b)=>nat(a.b.judul,b.b.judul));
  return `<p class="muted small">${R.length} judul ditemukan</p>${R.slice(0,60).map(opacCard).join('')||'<div class="emp"><b>Tidak ditemukan</b>Coba kata kunci lain.</div>'}${R.length>60?'<p class="small muted">Menampilkan 60 pertama. Persempit pencarian.</p>':''}`}
PAGES.opac=()=>{const f=S.ps.opac;return ph('Katalog','Cari buku di perpustakaan: judul, pengarang, atau topik, beserta ketersediaannya.',`<button class="btn" data-act="opacfs">Layar penuh</button>`)+`<div class="bar"><input class="opin" data-opac="q" placeholder="Cari judul, pengarang, atau topik…" value="${esc(f.q)}" autocomplete="off" aria-label="Cari buku"><select data-opac="jenis"><option value="">Semua jenis</option>${JENIS.map(x=>`<option ${f.jenis===x?'selected':''}>${x}</option>`).join('')}</select><select data-opac="kat">${opts(kategoriSorted(),'Semua kategori').map(o=>`<option value="${o[0]}" ${o[0]===f.kat?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div><div id="opres">${opacList()}</div>`};
PAGES.opac_after=()=>{const i=$('.opin');if(i)i.focus()};

Object.assign(ACT,{
 naikdo:naikDo,naikundo:naikUndo,
 wasent:async d=>{const p=S.db.pinjaman.find(x=>x.id===d.id);if(!p)return;await put('pinjaman',{...p,diingatkan:today()});setTimeout(()=>{if(S.page==='terlambat')go('terlambat')},400)},
 wacopy:d=>{const p=S.db.pinjaman.find(x=>x.id===d.id);if(p)return copyText(waText(p))},

});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.naik)S.ps.naik[t.dataset.naik]=t.value});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.opac){S.ps.opac[t.dataset.opac]=t.value;const r=$('#opres');if(r)r.innerHTML=opacList()}});


/* ========== Prioritas 3: kegiatan literasi, survei, berkas ========== */
function imgToData(file,max,q){max=max||720;q=q||.6;return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error('Gagal membaca berkas'));r.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('Gambar tidak bisa dibaca'));im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
/* --- kegiatan --- */
const KJENIS=['Kunjungan kelas','Gerakan literasi sekolah','Lomba / festival','Bedah buku / bercerita','Pameran / promosi','Pelatihan / rapat','Lainnya'];
S.ps.keg={y:String(new Date().getFullYear())};
const kegYears=()=>[...new Set([String(new Date().getFullYear()),...S.db.kegiatan.map(k=>(k.tgl||'').slice(0,4)).filter(Boolean)])].sort().reverse();
const kegList=()=>S.db.kegiatan.filter(k=>!S.ps.keg.y||(k.tgl||'').startsWith(S.ps.keg.y)).sort((a,b)=>b.tgl.localeCompare(a.tgl));
PAGES.kegiatan=()=>{const L=kegList(),f=S.ps.keg;
  return ph('Kegiatan Literasi','Catat kegiatan perpustakaan lengkap dengan foto sebagai bukti dokumentasi.',`<button class="btn" data-act="kegprint">${ICON('print',15)} Cetak dokumentasi</button><button class="btn" data-act="kegxls">${ICON('download',15)} Ekspor</button><button class="btn pri" data-act="kegadd">${ICON('plus',15)} Tambah</button>`)+
  `<div class="bar no-print"><select data-f="keg:y"><option value="">Semua tahun</option>${kegYears().map(y=>`<option ${y===f.y?'selected':''}>${y}</option>`).join('')}</select></div><p class="muted small">${L.length} kegiatan · ${fmtN(L.reduce((n,k)=>n+(+k.peserta||0),0))} peserta</p>`+
  tbl(['Tanggal','Kegiatan','Jenis','Peserta','Foto',''],L.map(k=>`<tr><td style="white-space:nowrap">${fmt(k.tgl)}</td><td><b>${esc(k.nama)}</b><div class="muted small">${esc(k.sasaran||'')}</div></td><td>${esc(k.jenis||'')}</td><td>${esc(k.peserta||'')}</td><td>${(k.foto||[]).map(x=>`<img src="${x}" alt="" style="width:40px;height:40px;object-fit:cover;border-radius:8px;margin-right:4px">`).join('')}</td><td class="act"><button class="btn sm" data-act="kegedit" data-id="${k.id}">${ICON('edit',14)}</button> <button class="btn sm dg" data-act="kegdel" data-id="${k.id}">${ICON('trash',14)}</button></td></tr>`).join(''),'Belum ada kegiatan tercatat.')};
function kegForm(o){o=o||{};let foto=[...(o.foto||[])];
  modal(o.id?'Ubah Kegiatan':'Tambah Kegiatan',`<form id="frm"><label class="fl"><span>Nama kegiatan <b class="rq">*</b></span><input name="nama" required value="${esc(o.nama||'')}"></label><label class="fl"><span>Jenis</span><select name="jenis">${KJENIS.map(x=>`<option ${o.jenis===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="fl"><span>Tanggal <b class="rq">*</b></span><input type="date" name="tgl" required value="${esc(o.tgl||today())}" max="${today()}"></label><label class="fl"><span>Jumlah peserta</span><input type="number" min="0" name="peserta" value="${esc(o.peserta||'')}"></label><label class="fl"><span>Sasaran (kelas atau kelompok)</span><input name="sasaran" value="${esc(o.sasaran||'')}" placeholder="mis. Kelas 3 dan 4"></label><label class="fl"><span>Uraian singkat</span><input name="uraian" value="${esc(o.uraian||'')}"></label><label class="fl"><span>Foto dokumentasi (maksimal 3, dikecilkan otomatis)</span><input type="file" id="kgf" accept="image/*" multiple></label><div id="kgp" class="row"></div><div class="df"><button type="button" class="btn" data-act="close">Batal</button><button class="btn pri">Simpan</button></div></form>`);
  const draw=()=>{$('#kgp').innerHTML=foto.map((x,i)=>`<span style="position:relative"><img src="${x}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:10px"><button type="button" class="btn sm dg" data-rm="${i}" style="position:absolute;top:-6px;right:-6px;padding:1px 6px" aria-label="Hapus foto">×</button></span>`).join('')};draw();
  $('#kgp').onclick=e=>{const b=e.target.closest('[data-rm]');if(b){foto.splice(+b.dataset.rm,1);draw()}};
  $('#kgf').onchange=async e=>{for(const f of [...e.target.files]){if(foto.length>=3){toast('Maksimal 3 foto','err');break}try{foto.push(await imgToData(f))}catch(er){toast(er.message,'err')}}e.target.value='';draw()};
  $('#frm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await put('kegiatan',{...o,id:o.id||uid(),nama:d.nama.trim(),jenis:d.jenis,tgl:d.tgl,peserta:d.peserta,sasaran:d.sasaran.trim(),uraian:d.uraian.trim(),foto,petugas:o.petugas||S.user.nama});await log(o.id?'Ubah':'Tambah','Kegiatan: '+d.nama.trim());closeModal();go('kegiatan')}catch(er){toast(fbErr(er),'err')}}}
function kegPrint(){const L=kegList().slice().reverse();if(!L.length)return toast('Belum ada kegiatan','err');
  printDoc('Dokumentasi Kegiatan Literasi'+(S.ps.keg.y?' Tahun '+S.ps.keg.y:''),L.map((k,i)=>`<div style="break-inside:avoid;margin-bottom:12px"><h3>${i+1}. ${esc(k.nama)}</h3><p>${fmtLong(k.tgl)} · ${esc(k.jenis||'')}${k.sasaran?' · Sasaran: '+esc(k.sasaran):''}${k.peserta?' · '+esc(k.peserta)+' peserta':''}</p>${k.uraian?`<p>${esc(k.uraian)}</p>`:''}<div style="display:flex;gap:6px;flex-wrap:wrap">${(k.foto||[]).map(x=>`<img src="${x}" alt="" style="height:140px;border:1px solid #888">`).join('')}</div></div>`).join('')+ttdHTML())}

const ASPEK=[['layanan','Keramahan dan kecepatan layanan petugas'],['koleksi','Kelengkapan dan kebaruan koleksi'],['ruang','Kenyamanan dan kebersihan ruang'],['manfaat','Manfaat perpustakaan untuk belajar dan membaca']];
const FACES=['😞','🙁','😐','🙂','😄'];
S.ps.sur={tab:'hasil',y:String(new Date().getFullYear())};
const surList=()=>S.db.survei.filter(x=>!S.ps.sur.y||(x.tgl||'').startsWith(S.ps.sur.y));
const surAvg=(L,k)=>L.length?L.reduce((n,x)=>n+(+(x.q||{})[k]||0),0)/L.length:0;
function surStats(){const L=surList(),f1=v=>v.toFixed(1).replace('.',',');
  if(!L.length)return '<div class="emp"><b>Belum ada responden</b>Buka tab Isi Survei di komputer perpustakaan agar siswa mengisinya sendiri.</div>';
  const all=ASPEK.reduce((n,a)=>n+surAvg(L,a[0]),0)/ASPEK.length;
  return `<div class="grid g4"><div class="card"><small class="muted">Responden</small><b style="font-size:24px;display:block">${fmtN(L.length)}</b></div><div class="card"><small class="muted">Rata-rata keseluruhan</small><b style="font-size:24px;display:block">${f1(all)} / 5</b></div></div><div class="card mt"><h3>Rata-rata per aspek</h3>${ASPEK.map(a=>{const v=surAvg(L,a[0]);return `<div style="margin:10px 0"><div class="row"><span class="sp">${a[1]}</span><b>${f1(v)}</b></div><div class="prog"><i style="width:${v/5*100}%"></i></div></div>`}).join('')}</div>
  <div class="card mt"><h3>Saran dan komentar</h3>${L.filter(x=>x.saran).sort((a,b)=>b.tgl.localeCompare(a.tgl)).slice(0,30).map(x=>`<div class="kv"><span>${esc(x.saran)}</span><span class="muted small" style="white-space:nowrap">${fmt(x.tgl)} · ${esc(x.peran||'')}</span></div>`).join('')||'<p class="muted small">Belum ada saran tertulis.</p>'}</div>`}
PAGES.survei=()=>{const f=S.ps.sur,t=f.tab;
  const tabs=`<div class="tabs no-print"><button class="${t==='hasil'?'on':''}" data-act="surtab" data-t="hasil">Hasil</button><button class="${t==='isi'?'on':''}" data-act="surtab" data-t="isi">Isi Survei</button></div>`;
  if(t==='isi')return ph('Survei Kepuasan','Serahkan layar ini kepada siswa atau guru. Jawaban tidak mencantumkan nama.')+tabs+`<form id="surf" class="card">${`<label class="fl"><span>Saya adalah</span><select name="peran"><option>Siswa</option><option>Guru</option><option>Lainnya</option></select></label>`}${ASPEK.map((a,i)=>`<div class="fl"><span style="font-size:15px;color:var(--tx)">${i+1}. ${a[1]}</span><div class="rts">${FACES.map((fc,j)=>`<label class="rt"><input type="radio" name="${a[0]}" value="${j+1}" ${j===0?'required':''}><span title="${j+1} dari 5">${fc}<small>${j+1}</small></span></label>`).join('')}</div></div>`).join('')}<label class="fl"><span>Saran untuk perpustakaan (boleh dikosongkan)</span><input name="saran" maxlength="300" autocomplete="off"></label><button class="btn pri" style="font-size:16px;padding:12px 22px">Kirim jawaban</button></form>`;
  return ph('Survei Kepuasan','Hasil survei kepuasan pemustaka sebagai bukti evaluasi layanan.',`<button class="btn" data-act="surprint">${ICON('print',15)} Cetak</button><button class="btn pri" data-act="surtab" data-t="isi">Isi Survei</button>`)+tabs+`<div class="bar no-print"><select data-f="sur:y"><option value="">Semua tahun</option>${[...new Set([String(new Date().getFullYear()),...S.db.survei.map(x=>(x.tgl||'').slice(0,4))])].sort().reverse().map(y=>`<option ${y===f.y?'selected':''}>${y}</option>`).join('')}</select></div>`+surStats()};
PAGES.survei_after=()=>{const f=$('#surf');if(!f)return;f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const q={};ASPEK.forEach(a=>q[a[0]]=+d[a[0]]);try{await put('survei',{id:uid(),tgl:today(),peran:d.peran,q,saran:(d.saran||'').trim()});f.reset();window.scrollTo(0,0);toast('Terima kasih! Jawaban tersimpan.','ok')}catch(er){toast(fbErr(er),'err')}}};
function surPrint(){const L=surList();if(!L.length)return toast('Belum ada responden','err');const f1=v=>v.toFixed(1).replace('.',',');
  printDoc('Hasil Survei Kepuasan Pemustaka'+(S.ps.sur.y?' Tahun '+S.ps.sur.y:''),`<p>Jumlah responden: <b>${L.length}</b> (${Object.entries(cnt(L,x=>x.peran||'–')).map(x=>x[0]+' '+x[1]).join(', ')}). Skala 1 (sangat kurang) sampai 5 (sangat baik).</p>`+tbl(['No','Aspek','Rata-rata'],ASPEK.map((a,i)=>`<tr><td>${i+1}</td><td>${a[1]}</td><td>${f1(surAvg(L,a[0]))}</td></tr>`).join(''))+`<h3>Saran dan komentar</h3>`+(L.filter(x=>x.saran).map(x=>`<p>• ${esc(x.saran)} <i>(${esc(x.peran||'')}, ${fmt(x.tgl)})</i></p>`).join('')||'<p>Tidak ada saran tertulis.</p>')+ttdHTML())}
/* --- berkas --- */
const BKS_KAT=['SK pengelola','Program kerja dan anggaran','Tata tertib dan jam layanan','Dokumentasi kegiatan','Laporan perpustakaan','Foto ruang dan sarana','Pelatihan pengelola','Lainnya'];
S.ps.bks={kat:''};
const bksList=()=>S.db.berkas.filter(b=>!S.ps.bks.kat||b.kat===S.ps.bks.kat).sort((a,b)=>BKS_KAT.indexOf(a.kat)-BKS_KAT.indexOf(b.kat)||(b.tgl||'').localeCompare(a.tgl||''));
PAGES.berkas=()=>{const L=bksList(),f=S.ps.bks,done=BKS_KAT.filter(k=>k!=='Lainnya'&&S.db.berkas.some(b=>b.kat===k)).length;
  return ph('Berkas Akreditasi','Daftar bukti pendukung akreditasi: di mana setiap dokumen disimpan.',`<button class="btn" data-act="bksprint">${ICON('print',15)} Cetak daftar isi</button><button class="btn pri" data-act="bksadd">${ICON('plus',15)} Tambah</button>`)+
  `<div class="card no-print"><div class="row"><b class="sp">Kategori inti terisi: ${done} dari ${BKS_KAT.length-1}</b></div><div class="prog mt"><i style="width:${done/(BKS_KAT.length-1)*100}%"></i></div><p class="small muted">Yang belum ada: ${BKS_KAT.filter(k=>k!=='Lainnya'&&!S.db.berkas.some(b=>b.kat===k)).join(', ')||'semua kategori sudah punya berkas'}. Berkas fisik dicatat lokasinya; berkas digital cukup tempel tautan Google Drive.</p></div>
  <div class="bar no-print mt"><select data-f="bks:kat"><option value="">Semua kategori</option>${BKS_KAT.map(k=>`<option ${k===f.kat?'selected':''}>${k}</option>`).join('')}</select></div>`+
  tbl(['Kategori','Nama berkas','Nomor / tanggal','Lokasi / tautan',''],L.map(b=>`<tr><td>${esc(b.kat)}</td><td><b>${esc(b.nama)}</b><div class="muted small">${esc(b.catatan||'')}</div></td><td>${esc(b.nomor||'')}${b.tgl?'<div class="muted small">'+fmt(b.tgl)+'</div>':''}</td><td>${esc(b.lokasi||'')}${safeUrl(b.link)?`<div><a href="${esc(safeUrl(b.link))}" target="_blank" rel="noopener">Buka tautan</a></div>`:''}</td><td class="act"><button class="btn sm" data-act="bksedit" data-id="${b.id}">${ICON('edit',14)}</button> <button class="btn sm dg" data-act="bksdel" data-id="${b.id}">${ICON('trash',14)}</button></td></tr>`).join(''),'Belum ada berkas tercatat.')};
function bksForm(o){formModal(o?'Ubah Berkas':'Tambah Berkas',[{k:'kat',l:'Kategori',t:'select',o:BKS_KAT.map(x=>[x,x])},{k:'nama',l:'Nama dokumen',r:1},{k:'nomor',l:'Nomor dokumen'},{k:'tgl',l:'Tanggal dokumen',t:'date'},{k:'lokasi',l:'Lokasi simpan fisik',ph:'mis. Map biru, lemari perpustakaan rak 2'},{k:'link',l:'Tautan berkas digital (Google Drive dsb.)',t:'url',ph:'https://'},{k:'catatan',l:'Catatan'}],o||{kat:BKS_KAT[0]},async d=>{
  if(d.link&&!safeUrl(d.link))throw new Error('Tautan harus diawali http:// atau https://');
  await put('berkas',{...(o||{}),id:o?o.id:uid(),kat:d.kat,nama:d.nama.trim(),nomor:d.nomor.trim(),tgl:d.tgl,lokasi:d.lokasi.trim(),link:d.link.trim(),catatan:d.catatan.trim()});await log(o?'Ubah':'Tambah','Berkas: '+d.nama.trim());go('berkas')})}
function bksPrint(){const L=bksList();if(!L.length)return toast('Belum ada berkas','err');printDoc('Daftar Isi Berkas Akreditasi Perpustakaan',tbl(['No','Kategori','Nama dokumen','Nomor / tanggal','Lokasi simpan'],L.map((b,i)=>`<tr><td>${i+1}</td><td>${esc(b.kat)}</td><td>${esc(b.nama)}</td><td>${esc(b.nomor||'')}${b.tgl?' / '+fmt(b.tgl):''}</td><td>${esc(b.lokasi||(safeUrl(b.link)?'Digital: '+b.link:''))}</td></tr>`).join(''))+ttdHTML())}
Object.assign(ACT,{
 kegadd:()=>kegForm(),kegedit:d=>kegForm(S.db.kegiatan.find(x=>x.id===d.id)),kegprint:kegPrint,
 kegdel:async d=>{if(!confirm('Hapus kegiatan ini beserta fotonya?'))return;await del('kegiatan',d.id);go('kegiatan')},
 kegxls:()=>exportRows('kegiatan-literasi',[['Tanggal','Kegiatan','Jenis','Sasaran','Peserta','Uraian'],...kegList().map(k=>[fmt(k.tgl),k.nama,k.jenis||'',k.sasaran||'',k.peserta||'',k.uraian||''])],true),
 surtab:d=>{S.ps.sur.tab=d.t;go('survei')},surprint:surPrint,
 bksadd:()=>bksForm(),bksedit:d=>bksForm(S.db.berkas.find(x=>x.id===d.id)),bksprint:bksPrint,
 bksdel:async d=>{if(!confirm('Hapus catatan berkas ini?'))return;await del('berkas',d.id);go('berkas')}
});

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.classList.contains('ov'))return;const f=ACT[t.dataset.act];if(f){Promise.resolve(f(t.dataset,t,e)).catch(er=>{console.error(er);toast(fbErr(er),'err')})}});
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('ov'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q){S.ps[t.dataset.q].q=t.value;S.ps[t.dataset.q].p=1;const L={buku:bukuList,anggota:angList,pinjaman:pinList}[t.dataset.q];$('#list').innerHTML=L()}
  if(t.dataset.lap){S.ps.lap[t.dataset.lap]=t.value;$('#list').innerHTML=lapBody()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){const[p,k]=t.dataset.f.split(':');S.ps[p][k]=t.value;if(S.ps[p].p!==undefined)S.ps[p].p=1;go(S.page)}});
if(matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){let cur=null;
  document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('.tilt');if(cur&&cur!==t){cur.style.transform='';cur=null}if(!t||t.classList.contains('hero')&&false)return;cur=t;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(800px) rotateX(${(-y*7).toFixed(2)}deg) rotateY(${(x*9).toFixed(2)}deg)`;t.style.setProperty('--gx',(x+.5)*100+'%');t.style.setProperty('--gy',(y+.5)*100+'%')});
  document.addEventListener('mouseleave',()=>{if(cur){cur.style.transform='';cur=null}})}

/* ========== Firebase ========== */
function bootFB(){
  ensure('fb1').then(()=>Promise.all([ensure('fb2'),ensure('fb3')])).then(()=>{
    firebase.initializeApp(FBC);S.auth=firebase.auth();S.fs=firebase.firestore();
    try{S.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
    S.auth.onAuthStateChanged(u=>{if(u)startFB(u);else{(S.unsub||[]).forEach(f=>f());S.unsub=[];S.user=null;showLogin()}})
  }).catch(e=>{toast(e.message,'err');showLogin()})}
function startFB(u){(S.unsub||[]).forEach(f=>f());S.unsub=[];let ready=false;const want=new Set([...COLS,'kunjungan','meta']);const got=new Set();
  const check=k=>{got.add(k);if(!ready&&got.size>=want.size){ready=true;setUser();enter()}else if(ready){setUser();refresh()}};
  const setUser=()=>{const p=S.db.petugas.find(x=>(x.email||'').toLowerCase()===(u.email||'').toLowerCase());S.user={id:u.uid,nama:p?p.nama:u.email};if(ready){$('#usr').innerHTML=ICON('users',14)+'<span class="un">'+esc(S.user.nama)+'</span>';$('#blogo').src=logo();$('#bnama').textContent=set().nama}};
  const err=e=>{toast(fbErr(e),'err')};
  COLS.forEach(c=>{let q=S.fs.collection(c);if(c==='riwayat')q=q.orderBy('waktu','desc').limit(500);S.unsub.push(q.onSnapshot(s=>{S.db[c]=s.docs.map(d=>d.data());check(c)},e=>{err(e);check(c)}))});
  S.unsub.push(S.fs.collection('kunjungan').orderBy(firebase.firestore.FieldPath.documentId(),'desc').limit(400).onSnapshot(s=>{S.db.kunjungan=s.docs.flatMap(d=>d.data().items||[]);check('kunjungan')},e=>{err(e);check('kunjungan')}));S.unsub.push(S.fs.collection('meta').doc('sekolah').onSnapshot(s=>{if(s.exists)S.db.set=s.data();defaults();check('meta')},e=>{err(e);check('meta')}))}

/* ========== mulai ========== */
(function init(){
  const th=localStorage.getItem('pustaka_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th;
  ensure('qr').catch(()=>{});initPWA();
  if(USE_FB){defaults();bootFB()}
  else{loadLocal();defaults();const uid0=sessionStorage.getItem('pustaka_u'),p=S.db.petugas.find(x=>x.id===uid0);if(p){S.user=p;enter()}else showLogin()}
})();
</script>
