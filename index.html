<style>
:root{--g1:#14532d;--g2:#166534;--g3:#22c55e;--y:#facc15;--bg:#eef3ee;--bg2:#e3ece4;--card:#fff;--tx:#10231a;--mu:#5b6f64;--bd:#d6e2d9;--rd:#dc2626;--or:#d97706;--bl:#2563eb;--sh:0 1px 1px rgba(16,35,26,.06),0 4px 8px rgba(16,35,26,.06),0 14px 28px rgba(16,35,26,.08);--sh2:0 2px 2px rgba(16,35,26,.08),0 10px 20px rgba(16,35,26,.12),0 30px 50px rgba(16,35,26,.14)}
[data-theme=dark]{--bg:#0b1510;--bg2:#101d16;--card:#15251c;--tx:#e8f2ea;--mu:#90a799;--bd:#25382d;--sh:0 1px 1px rgba(0,0,0,.4),0 6px 12px rgba(0,0,0,.35),0 18px 36px rgba(0,0,0,.4);--sh2:0 2px 2px rgba(0,0,0,.5),0 14px 26px rgba(0,0,0,.5),0 36px 60px rgba(0,0,0,.55)}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh;background-image:radial-gradient(900px 500px at 10% -10%,rgba(34,197,94,.14),transparent),radial-gradient(700px 400px at 100% 0,rgba(250,204,21,.10),transparent);background-attachment:fixed}
h1,h2,h3{margin:0}h3{font-size:15px}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:linear-gradient(180deg,#0f3d22,#14532d 60%,#0f3d22);color:#e8f5ec;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;z-index:30;box-shadow:6px 0 24px rgba(0,0,0,.18)}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}
.brand img{width:42px;height:42px;border-radius:12px;background:#fff;object-fit:contain;padding:3px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.brand b{display:block;font-size:17px;letter-spacing:.5px}.brand small{opacity:.7;font-size:11px;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;color:#cfe5d6;text-decoration:none;cursor:pointer;transition:.2s}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:linear-gradient(180deg,#2a7a47,#1d6a3a);color:#fff;transform:translateY(-2px) translateZ(0);box-shadow:0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);font-weight:700}
.sfoot .btn{color:#10231a;justify-content:center}.sfoot{padding:10px 6px 0;font-size:11px;color:#a9c9b4;display:flex;flex-direction:column;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.top h2{font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-size:12px;font-weight:600;cursor:default;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--bd);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--bd);transition:.12s}
.ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--bd)}
.menub{display:none}
.view{padding:18px;flex:1;max-width:1300px;width:100%}
.view>*{animation:rise .5s both}
.view>*:nth-child(2){animation-delay:.06s}.view>*:nth-child(3){animation-delay:.12s}.view>*:nth-child(4){animation-delay:.18s}.view>*:nth-child(5){animation-delay:.24s}.view>*:nth-child(n+6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.foot{padding:14px 18px 20px;display:flex;justify-content:flex-end;color:var(--mu);font-size:11px;font-weight:600;border-top:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);transition:box-shadow .25s,transform .25s;position:relative;min-width:0}
.tilt{transition:transform .15s ease-out,box-shadow .25s;will-change:transform}
.tilt:hover{box-shadow:var(--sh2)}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:.2s;background:radial-gradient(260px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.28),transparent 60%)}
.tilt:hover::after{opacity:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:600;box-shadow:0 3px 0 var(--bd),0 6px 10px rgba(0,0,0,.05);transition:.12s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--bd)}
.btn.pri{background:linear-gradient(180deg,#2f9a5a,#1f7a44);color:#fff;border-color:#166534;box-shadow:0 3px 0 #0f4a28,0 8px 14px rgba(22,101,52,.35)}
.btn.pri:active{box-shadow:0 0 0 #0f4a28}
.btn.dg{color:var(--rd)}.btn.sm{padding:5px 9px;font-size:12px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.ph{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-size:22px}.ph p{margin:2px 0 0;color:var(--mu);font-size:12.5px}
input,select{width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--bd);background:var(--card);outline:none;box-shadow:inset 0 2px 3px rgba(0,0,0,.05)}
input:focus,select:focus{border-color:var(--g3);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{flex:1 1 150px}.bar .btn{flex:none}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mu);padding:10px 12px;background:var(--bg2);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--bd);vertical-align:middle}
tbody tr{transition:.15s}tbody tr:hover{background:var(--bg2);box-shadow:inset 3px 0 0 var(--g3)}
td.act{white-space:nowrap;text-align:right}
.bd{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.bd.ok{background:#dcfce7;color:#166534}.bd.wa{background:#fef3c7;color:#92400e}.bd.er{background:#fee2e2;color:#991b1b}.bd.in{background:#dbeafe;color:#1e40af}
[data-theme=dark] .bd.ok{background:#14532d;color:#bbf7d0}[data-theme=dark] .bd.wa{background:#713f12;color:#fde68a}[data-theme=dark] .bd.er{background:#7f1d1d;color:#fecaca}[data-theme=dark] .bd.in{background:#1e3a8a;color:#bfdbfe}
.qrs{width:34px;height:34px;border-radius:4px;background:#fff;padding:2px;display:block}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.stat{color:#fff;border:0;overflow:hidden}
.stat small{opacity:.9;font-weight:600}.stat b{display:block;font-size:30px;margin-top:4px}
.stat::before{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18)}
.s1{background:linear-gradient(135deg,#f59e0b,#f97316)}.s2{background:linear-gradient(135deg,#3b82f6,#2563eb)}.s3{background:linear-gradient(135deg,#10b981,#059669)}.s4{background:linear-gradient(135deg,#ef4444,#be123c)}
.hero{background:linear-gradient(135deg,#14532d,#1d7a42 60%,#2a9d57);color:#fff;border-radius:22px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;overflow:hidden;position:relative;box-shadow:var(--sh2)}
.hero h1{font-size:22px}.hero p{margin:6px 0 0;opacity:.85}
.scene{perspective:700px;display:flex;gap:26px;padding:6px 18px;transform-style:preserve-3d;flex:none}
.b3{width:54px;height:76px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite;transform:rotateX(-14deg)}
.b3.bb2{animation-duration:12s;animation-direction:reverse;margin-top:14px}.b3.bb3{animation-duration:15s}
@keyframes spin{to{transform:rotateX(-14deg) rotateY(360deg)}}
.b3 .f{position:absolute;display:block}
.b3 .fr,.b3 .bk{width:54px;height:76px;background:var(--c1,#facc15);border-radius:3px}
.b3 .fr{transform:translateZ(13px);background:linear-gradient(135deg,var(--c1,#facc15),var(--c2,#f59e0b))}
.b3 .bk{transform:rotateY(180deg) translateZ(13px)}
.b3 .lf,.b3 .rt{width:26px;height:76px;left:14px;background:#f8fafc;background-image:repeating-linear-gradient(#f8fafc 0 2px,#cbd5e1 2px 3px)}
.b3 .lf{transform:rotateY(-90deg) translateZ(27px);background:var(--c2,#f59e0b)}.b3 .rt{transform:rotateY(90deg) translateZ(27px)}
.b3 .tp,.b3 .bt{width:54px;height:26px;top:25px;background:#f1f5f9}
.b3 .tp{transform:rotateX(90deg) translateZ(38px)}.b3 .bt{transform:rotateX(-90deg) translateZ(38px)}
.b3.bb2{--c1:#60a5fa;--c2:#2563eb}.b3.bb3{--c1:#f472b6;--c2:#be185d}
.alert{padding:11px 14px;border-radius:14px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
[data-theme=dark] .alert{background:#422006;color:#fde68a;border-color:#713f12}
canvas.ch{width:100%;height:230px;display:block}
.fl{display:block;margin-bottom:11px}.fl span{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--mu)}.rq{color:var(--rd)}
.ov{position:fixed;inset:0;background:rgba(5,15,10,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:14px;perspective:1000px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--card);border-radius:20px;width:100%;max-width:460px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh2);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.dlg.wide{max-width:760px}
@keyframes pop{from{opacity:0;transform:translateY(40px) rotateX(-18deg) scale(.9)}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.db{padding:16px;overflow:auto}.df{display:flex;gap:8px;justify-content:flex-end;padding-top:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 24px);max-width:420px}
.tst{background:#10231a;color:#fff;padding:10px 16px;border-radius:14px;box-shadow:var(--sh2);animation:pop .45s cubic-bezier(.2,1.4,.4,1);font-weight:600;font-size:13px}.tst.err{background:#991b1b}.tst.ok{background:#166534}
.mcard{width:100%;max-width:430px;aspect-ratio:1.586;border-radius:18px;background:#fff;color:#10231a;overflow:hidden;box-shadow:var(--sh2);display:flex;flex-direction:column;margin:0 auto;border:1px solid #d6e2d9;position:relative}
.mcard .mh{background:linear-gradient(135deg,#14532d,#1f7a44);color:#fff;padding:9px 12px;display:flex;gap:9px;align-items:center}
.mcard .mh img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
.mcard .mh b{display:block;font-size:12px}.mcard .mh small{font-size:9.5px;opacity:.85;display:block}
.mcard .mb{flex:1;display:flex;gap:10px;padding:10px 12px;align-items:center}
.mcard .mb img.q{width:30%;aspect-ratio:1;background:#fff}
.mcard dl{margin:0;font-size:10.5px;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;flex:1;min-width:0}.mcard dt{color:#5b6f64}.mcard dd{margin:0;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.mcard .mf{height:7px;background:linear-gradient(90deg,#facc15,#22c55e)}
.drop{border:2px dashed var(--bd);border-radius:16px;padding:22px;text-align:center;color:var(--mu);cursor:pointer;transition:.2s}
.drop.on,.drop:hover{border-color:var(--g3);background:rgba(34,197,94,.07)}
.kv{display:flex;gap:8px;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}
.rank{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
.rank .no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--bg2)}.rank .no.g{background:linear-gradient(135deg,#fde047,#f59e0b);color:#5b3a00;box-shadow:0 3px 6px rgba(245,158,11,.5)}
.pg{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pg .btn.on{background:var(--g2);color:#fff}
.muted{color:var(--mu)}.small{font-size:12px}.mt{margin-top:14px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;perspective:1000px}
.lcard{width:100%;max-width:380px;text-align:center;padding:26px 22px}
.lcard .scene{justify-content:center;margin-bottom:6px}
.lcard img.lg{width:64px;height:64px;object-fit:contain}
.lcard form{text-align:left;margin-top:14px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}.chk i{width:18px;font-style:normal;font-weight:800}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.scene{display:none}}
@media(max-width:820px){.side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:.3s}.side.open{transform:none}.menub{display:inline-grid}.view{padding:12px}.hero{padding:16px}}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
@media(max-width:520px){.g4{gap:10px}.stat b{font-size:24px}.chip{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.scene{display:none}.tilt{transform:none!important}}
@media print{.side,.top,.foot,.no-print{display:none!important}}
</style>

const LIBS={qr:'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',h5:'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',fb1:'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',fb2:'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',fb3:'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'};
const _lp={};
function ensure(k){return _lp[k]||(_lp[k]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=LIBS[k];s.onload=ok;s.onerror=()=>{delete _lp[k];no(new Error('Gagal memuat pustaka ('+k+'). Periksa koneksi internet.'))};document.head.appendChild(s)}))}

const COLS=['kelas','kategori','buku','anggota','pinjaman','petugas','riwayat'];
const S={db:{kelas:[],kategori:[],buku:[],anggota:[],pinjaman:[],petugas:[],riwayat:[],set:{}},user:null,page:'dashboard',scan:{a:null,b:null},ps:{},imp:null};
const FBC=window.PUSTAKA_FIREBASE||{};
const USE_FB=!!(FBC.apiKey&&FBC.projectId);
const LS='pustaka_db_v1';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)Object.assign(S.db,d)}catch(e){}}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S.db))}catch(e){toast('Penyimpanan penuh atau diblokir peramban','err')}}
function defaults(){S.db.set=Object.assign({nama:'Nama Sekolah Anda',alamat:'',kepala:'',hari:7,logo:'',diatur:false},S.db.set||{})}
const set=()=>S.db.set;
const logo=()=>set().logo||DEFAULT_LOGO;
async function put(col,o){const a=S.db[col],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else if(col==='riwayat')a.unshift(o);else a.push(o);if(USE_FB)await S.fs.collection(col).doc(o.id).set(o);else persist()}
async function putMany(col,arr){const a=S.db[col],m=new Map(a.map((x,i)=>[x.id,i]));arr.forEach(o=>{if(m.has(o.id))a[m.get(o.id)]=o;else{m.set(o.id,a.length);a.push(o)}});if(USE_FB){for(let i=0;i<arr.length;i+=400){const b=S.fs.batch();arr.slice(i,i+400).forEach(o=>b.set(S.fs.collection(col).doc(o.id),o));await b.commit()}}else persist()}
async function del(col,id){S.db[col]=S.db[col].filter(x=>x.id!==id);if(USE_FB)await S.fs.collection(col).doc(id).delete();else persist()}
async function delAll(col){const ids=S.db[col].map(x=>x.id);S.db[col]=[];if(USE_FB){for(let i=0;i<ids.length;i+=400){const b=S.fs.batch();ids.slice(i,i+400).forEach(id=>b.delete(S.fs.collection(col).doc(id)));await b.commit()}}else persist()}
async function saveSet(p){Object.assign(S.db.set,p);if(USE_FB)await S.fs.collection('meta').doc('sekolah').set(S.db.set);else persist()}
function log(aksi,detail){return put('riwayat',{id:uid(),waktu:new Date().toISOString(),petugas:S.user?S.user.nama:'-',aksi,detail:detail||''}).catch(()=>{})}
const kn=id=>(S.db.kelas.find(x=>x.id===id)||{}).nama||'–';
const cn=id=>(S.db.kategori.find(x=>x.id===id)||{}).nama||'–';
const bukuBy=id=>S.db.buku.find(x=>x.id===id);
const angBy=id=>S.db.anggota.find(x=>x.id===id);
const activeLoans=()=>{const m=new Map();S.db.pinjaman.forEach(p=>{if(!p.tglKembali)m.set(p.bukuId,p)});return m};

const kategoriSorted=()=>[...S.db.kategori].sort((a,b)=>nat(a.nama,b.nama));

function toast(m,t){const e=document.createElement('div');e.className='tst '+(t||'');e.textContent=m;$('#toast').appendChild(e);setTimeout(()=>e.remove(),t==='err'?5000:2600)}
function modal(title,body,wide){$('#modal').innerHTML=`<div class="ov"><div class="dlg ${wide?'wide':''}" role="dialog"><div class="dh"><h3>${title}</h3><button class="ib" data-act="close" aria-label="Tutup">${ICON('x')}</button></div><div class="db">${body}</div></div></div>`}

function formModal(title,fields,vals,onSave){
  const h=fields.map(f=>{const v=vals[f.k]??'';let i;
    if(f.t==='select')i=`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else i=`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.r?'required':''} ${f.list?`list="${f.list}"`:''} ${f.m?`maxlength="${f.m}"`:''} autocomplete="off">`;

const tbl=(heads,rows,empty)=>`<div class="tw"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${heads.length}" class="muted" style="text-align:center;padding:28px">${empty||'Belum ada data.'}</td></tr>`}</tbody></table></div>`;
const PS=25;
function paginate(arr,key){const st=S.ps[key];const n=Math.max(1,Math.ceil(arr.length/PS));if(st.p>n)st.p=n;return arr.slice((st.p-1)*PS,st.p*PS)}
function pager(total,key){const n=Math.ceil(total/PS);if(n<=1)return '';const p=S.ps[key].p;let h='';for(let i=1;i<=n;i++){if(n>9&&Math.abs(i-p)>2&&i!==1&&i!==n){if(h.slice(-3)!=='…')h+='<span>…</span>';continue}h+=`<button class="btn sm ${i===p?'on':''}" data-act="pg" data-k="${key}" data-p="${i}">${i}</button>`}return `<div class="pg">${h}</div>`}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
const csvCell=v=>{v=String(v??'');return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
async function exportRows(name,rows,asXlsx){if(asXlsx){try{await ensure('xlsx');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Data');XLSX.writeFile(wb,name+'.xlsx');return}catch(e){toast('Excel tidak bisa dibuat, diganti CSV','err')}}download(name+'.csv',toCSV(rows),'text/csv')}

/* ========== QR & kartu ========== */
const qrCache=new Map();
function qrData(t,size=200){const k=t+'|'+size;if(qrCache.has(k))return qrCache.get(k);let u='';try{const d=document.createElement('div');new QRCode(d,{text:String(t),width:size,height:size,correctLevel:QRCode.CorrectLevel.M});const c=d.querySelector('canvas');u=c?c.toDataURL():(d.querySelector('img')||{}).src||''}catch(e){}if(u)qrCache.set(k,u);return u}
const qrImg=(t,c)=>{const u=qrData(t);return u?`<img class="${c||'q'}" src="${u}" alt="QR ${esc(t)}">`:`<span class="muted small">QR tidak termuat</span>`};
function cardHTML(a){return `<div class="mcard tilt"><div class="mh"><img src="${esc(logo())}" alt=""><div><b>Kartu Anggota Perpustakaan</b><small>${esc(set().nama)}</small></div></div><div class="mb">${qrImg(a.nisn)}<dl><dt>NISN</dt><dd>${esc(a.nisn)}</dd><dt>Nama</dt><dd>${esc(a.nama)}</dd><dt>Kelas</dt><dd>${esc(kn(a.kelasId))}</dd><dt>TTL</dt><dd>${esc([a.tempat,fmt(a.tgl)].filter(x=>x&&x!=='–').join(', ')||'–')}</dd><dt>Jenis Kelamin</dt><dd>${esc(a.jk||'–')}</dd></dl></div><div class="mf"></div></div>`}
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function cardPNG(a){const W=856,H=540,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#14532d');g.addColorStop(1,'#1f7a44');x.fillStyle=g;x.fillRect(0,0,W,120);
  const lg=await loadImg(logo());if(lg){x.fillStyle='#fff';x.beginPath();x.arc(70,60,44,0,7);x.fill();const r=Math.min(72/lg.width,72/lg.height);x.drawImage(lg,70-lg.width*r/2,60-lg.height*r/2,lg.width*r,lg.height*r)}
  x.fillStyle='#fff';x.font='700 32px Arial';x.fillText('Kartu Anggota Perpustakaan',130,56);x.font='20px Arial';x.fillText(set().nama,130,92,690);
  const q=await loadImg(qrData(a.nisn,300));if(q)x.drawImage(q,40,160,250,250);
  const rows=[['NISN',a.nisn],['Nama',a.nama],['Kelas',kn(a.kelasId)],['TTL',[a.tempat,fmt(a.tgl)].filter(v=>v&&v!=='–').join(', ')||'–'],['Jenis Kelamin',a.jk||'–']];
  rows.forEach((r,i)=>{x.fillStyle='#5b6f64';x.font='20px Arial';x.fillText(r[0],320,190+i*52);x.fillStyle='#10231a';x.font='700 25px Arial';x.fillText(String(r[1]),320,218+i*52,500)});
  const g2=x.createLinearGradient(0,0,W,0);g2.addColorStop(0,'#facc15');g2.addColorStop(1,'#22c55e');x.fillStyle=g2;x.fillRect(0,H-22,W,22);
  return new Promise(r=>c.toBlob(r,'image/png'))}

const hash=s=>{let h=5381;for(const c of String(s))h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};

  $('#login').innerHTML=`<div class="login"><div class="card lcard tilt">${head}${form}<div class="small muted" style="margin-top:14px">Design by Akhmad Fitra Harry, S.Pd</div></div></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));

    }catch(er){toast(fbErr(er),'err')}}
}
function fbErr(e){const c=e&&e.code||'';const m={'auth/invalid-credential':'Email atau kata sandi salah','auth/wrong-password':'Email atau kata sandi salah','auth/user-not-found':'Akun tidak ditemukan','auth/too-many-requests':'Terlalu banyak percobaan, coba lagi nanti','auth/unauthorized-domain':'Domain belum diizinkan. Tambahkan di Authentication > Settings > Authorized domains','auth/operation-not-allowed':'Email/Password belum diaktifkan di Firebase','permission-denied':'Akses ditolak. Periksa aturan Firestore dan pastikan sudah Publish','auth/network-request-failed':'Tidak ada koneksi internet'};return m[c]||(e&&e.message)||'Terjadi kesalahan'}

const dark=()=>document.documentElement.dataset.theme==='dark';
function setupCanvas(c){const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);const x=c.getContext('2d');if(!x)return null;x.scale(dpr,dpr);return{x,w:r.width,h:r.height}}
function drawBars(c,lab,val,hv){if(!c)return;try{const s=setupCanvas(c);if(!s)return;const{x,w,h}=s;x.clearRect(0,0,w,h);const mx=Math.max(4,...val),L=30,B=26,T=22,n=val.length,gw=(w-L-14)/n,bw=Math.min(40,gw*.5),d=9;
  x.font='11px Plus Jakarta Sans,Arial';x.fillStyle=dark()?'#90a799':'#5b6f64';x.strokeStyle=dark()?'#25382d':'#e3ece4';
  for(let i=0;i<=4;i++){const y=T+(h-T-B)*(1-i/4);x.beginPath();x.moveTo(L,y);x.lineTo(w-6,y);x.stroke();x.textAlign='right';x.fillText(Math.round(mx*i/4),L-6,y+4)}
  c._b=[];val.forEach((v,i)=>{if(!v&&hv!==i){c._b.push([0,0,0,0]);x.fillStyle=dark()?'#e8f2ea':'#10231a';x.textAlign='center';x.fillText(lab[i],L+gw*i+gw/2,h-8);return}const bh=(h-T-B-d)*v/mx,bx=L+gw*i+(gw-bw)/2,by=h-B-bh,hot=hv===i;c._b.push([bx,by-d,bw+d,bh+d]);
    x.fillStyle=hot?'#16a34a':'#22c55e';x.fillRect(bx,by,bw,bh);
    x.fillStyle=hot?'#86efac':'#4ade80';x.beginPath();x.moveTo(bx,by);x.lineTo(bx+d,by-d);x.lineTo(bx+bw+d,by-d);x.lineTo(bx+bw,by);x.fill();
    x.fillStyle=hot?'#166534':'#15803d';x.beginPath();x.moveTo(bx+bw,by);x.lineTo(bx+bw+d,by-d);x.lineTo(bx+bw+d,by+bh-d);x.lineTo(bx+bw,by+bh);x.fill();
    x.fillStyle=dark()?'#e8f2ea':'#10231a';x.textAlign='center';x.fillText(lab[i],bx+bw/2,h-8);if(v||hot)x.fillText(v,bx+bw/2+d/2,by-d-5)});
  if(!c._h){c._h=1;c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),mx2=e.clientX-r.left,my=e.clientY-r.top;const i=(c._b||[]).findIndex(b=>mx2>=b[0]&&mx2<=b[0]+b[2]&&my>=b[1]&&my<=b[1]+b[3]);if(i!==c._hi){c._hi=i;drawBars(c,lab,val,i)}});c.addEventListener('mouseleave',()=>{c._hi=-1;drawBars(c,lab,val,-1)})}}catch(e){console.warn(e)}}
function drawPie(c,data,hv){if(!c)return;try{const s=setupCanvas(c);if(!s)return;const{x,w,h}=s;x.clearRect(0,0,w,h);const tot=data.reduce((a,b)=>a+b[1],0);
  if(!tot){x.fillStyle=dark()?'#90a799':'#5b6f64';x.textAlign='center';x.font='13px Plus Jakarta Sans,Arial';x.fillText('Belum ada data jenis kelamin',w/2,h/2);return}
  const cx=w*.3,cy=h*.42,rx=Math.min(w*.24,95),ry=rx*.55,dp=16;
  const sl=[];let a0=-Math.PI/2;data.forEach((d,i)=>{const a1=a0+Math.PI*2*d[1]/tot;sl.push([a0,a1,d,i]);a0=a1});
  const shade=(hex,k)=>{const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`};
  const draw=(dy,k)=>sl.forEach(([p,q,d,i])=>{if(d[1]===0)return;const off=hv===i?-6:0;x.fillStyle=shade(d[2],k);x.beginPath();x.moveTo(cx,cy+dy+off);x.ellipse(cx,cy+dy+off,rx,ry,0,p,q);x.closePath();x.fill()});
  for(let k=dp;k>0;k-=2)draw(k,.62);draw(0,1);
  x.font='12px Plus Jakarta Sans,Arial';x.textAlign='left';data.forEach((d,i)=>{const ly=cy-26+i*26,lx=cx+rx+22;x.fillStyle=d[2];x.fillRect(lx,ly,12,12);x.fillStyle=dark()?'#e8f2ea':'#10231a';x.fillText(d[0]+': '+d[1]+' ('+Math.round(100*d[1]/tot)+'%)',lx+18,ly+11)});
  if(!c._h){c._h=1;c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),px=e.clientX-r.left-cx,py=(e.clientY-r.top-cy)/(ry/rx);let i=-1;if(Math.hypot(px,py)<=rx){let a=Math.atan2(py,px);if(a<-Math.PI/2)a+=Math.PI*2;i=sl.findIndex(z=>a>=z[0]&&a<z[1])}if(i!==c._hi){c._hi=i;drawPie(c,data,i)}});c.addEventListener('mouseleave',()=>{c._hi=-1;drawPie(c,data,-1)})}}catch(e){console.warn(e)}}

const IMP={
 buku:{l:'Buku',key:'kode',req:['kode','judul'],f:[['kode','Kode',['kode','kodebuku','barcode']],['inv','No Inventaris',['noinventaris','nomorinventaris','inventaris','noinv']],['judul','Judul',['judul','judulbuku']],['pengarang','Pengarang',['pengarang','penulis']],['tahun','Tahun Terbit',['tahunterbit','tahun']],['kelas','Kelas',['kelas']],['kategori','Kategori',['kategori']]],ex:['BK001','001/INV/2026','Judul Buku','Nama Pengarang','2024','Kelas 1','Cerita Anak']},
 anggota:{l:'Anggota',key:'nisn',req:['nisn','nama'],f:[['nisn','NISN',['nisn','nis']],['nama','Nama',['nama','namalengkap']],['kelas','Kelas',['kelas']],['tempat','Tempat Lahir',['tempatlahir','tempat']],['tgl','Tanggal Lahir',['tanggallahir','tgllahir']],['jk','Jenis Kelamin',['jeniskelamin','jk','gender']]],ex:['1234567890','Nama Siswa','Kelas 1','Kota Contoh','31-12-2016','Laki-Laki']},
 kelas:{l:'Kelas',key:'nama',req:['nama'],f:[['nama','Nama Kelas',['nama','namakelas','kelas']]],ex:['Kelas 1']},
 kategori:{l:'Kategori',key:'nama',req:['nama'],f:[['nama','Nama Kategori',['nama','namakategori','kategori']]],ex:['Cerita Anak']},
 pinjaman:{l:'Peminjaman',key:null,req:['nisn','kode','tglPinjam'],f:[['nisn','NISN',['nisn','nis']],['kode','Kode Buku',['kodebuku','kode']],['tglPinjam','Tanggal Pinjam',['tanggalpinjam','tglpinjam','dipinjam']],['tenggat','Tenggat',['tenggat','jatuhtempo','tanggaltenggat']],['tglKembali','Tanggal Kembali',['tanggalkembali','tglkembali','dikembalikan']]],ex:['1234567890','BK001','01-11-2026','08-11-2026','']}
};
const norm=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'');
function parseCSV(t){t=t.replace(/^\ufeff/,'');const first=t.split(/\r?\n/)[0]||'',sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
async function readSheet(file){const n=file.name.toLowerCase();if(/\.(csv|txt)$/.test(n))return parseCSV(await file.text());await ensure('xlsx');const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:'',blankrows:false})}
function parseDate(v){if(v===''||v==null)return '';if(v instanceof Date){if(isNaN(v))return null;const d=new Date(v.getTime()+12*36e5);return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?null:d.toISOString().slice(0,10)}
  let s=String(v).trim(),m;if(m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/))return chk(m[1],m[2],m[3]);if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))return chk(m[3],m[2],m[1]);return null}
function chk(y,m,d){y=+y;m=+m;d=+d;const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?y+'-'+pad(m)+'-'+pad(d):null}
const normJK=v=>{const s=norm(v);if(!s)return '';if(/^(l|lk|laki|lakilaki|pria|male)$/.test(s))return 'Laki-Laki';if(/^(p|pr|perempuan|wanita|female)$/.test(s))return 'Perempuan';return null};
const cellStr=v=>v instanceof Date?parseDate(v):String(v??'').trim();
PAGES.impor=()=>{const t=S.imp?S.imp.type:'buku';
  return ph('Impor Data','Isi data sekaligus dari Excel atau CSV. Maksimal '+MX+' baris per berkas.')+`<div class="card"><div class="row"><label class="fl" style="margin:0;min-width:180px"><span>Jenis data</span><select id="imtype">${Object.entries(IMP).map(([k,v])=>`<option value="${k}" ${k===t?'selected':''}>${v.l}</option>`).join('')}</select></label><div class="sp"></div><button class="btn" data-act="tplx">${ICON('download',15)} Template Excel</button><button class="btn" data-act="tplc">${ICON('download',15)} Template CSV</button></div>
  <p class="muted small">Urutan yang disarankan: Kelas, Kategori, Buku, Anggota, lalu Peminjaman. Kelas dan kategori yang belum ada dibuat otomatis dari isi berkas Buku/Anggota. Impor Peminjaman butuh anggota dan buku yang sudah terdaftar.</p>

PAGES.impor_after=()=>{const d=$('#drop'),f=$('#imfile');d.onclick=()=>f.click();f.onchange=()=>f.files[0]&&impFile(f.files[0]);
  ['dragover','dragenter'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('on')}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('on')}));d.addEventListener('drop',x=>{const fl=x.dataTransfer.files[0];if(fl)impFile(fl)});
  $('#imtype').onchange=e=>{S.imp={type:e.target.value};$('#imprev').innerHTML=''};if(S.imp&&S.imp.items)impPreview()};
async function impFile(file){const type=$('#imtype').value,cfg=IMP[type];
  try{const rows=await readSheet(file);if(rows.length<2)return toast('Berkas kosong atau hanya berisi judul kolom','err');if(rows.length-1>MX)return toast('Maksimal '+MX+' baris. Berkas ini '+(rows.length-1)+' baris.','err');
    const head=rows[0].map(norm),idx={};cfg.f.forEach(([k,,al])=>{const i=head.findIndex(h=>al.includes(h));if(i>=0)idx[k]=i});
    const miss=cfg.req.filter(k=>!(k in idx));if(miss.length)return toast('Kolom wajib tidak ditemukan: '+miss.map(k=>cfg.f.find(f=>f[0]===k)[1]).join(', ')+'. Unduh template untuk contoh.','err');
    const items=[],seen=new Set(),lo=activeLoans();
    rows.slice(1).forEach((r,i)=>{const n=i+2,o={};cfg.f.forEach(([k])=>{o[k]=k in idx?cellStr(r[idx[k]]):''});if(!Object.values(o).some(v=>v))return;
      const it={n,o,st:'baru',msg:''},bad=m=>{it.st='salah';it.msg=m};
      const miss2=cfg.req.find(k=>!o[k]);if(miss2)bad('kolom '+cfg.f.find(f=>f[0]===miss2)[1]+' kosong');
      else if(type==='buku'){const kk=o.kode.toLowerCase();if(seen.has(kk))bad('kode kembar di berkas');else{seen.add(kk);const e=S.db.buku.find(b=>b.kode.toLowerCase()===kk);if(e){it.st='ada';it.eid=e.id}if(o.inv){const e2=S.db.buku.find(b=>b.inv&&b.inv===o.inv&&b.id!==it.eid);if(e2)bad('No inventaris dipakai buku '+e2.kode)}}}
      else if(type==='anggota'){if(seen.has(o.nisn))bad('NISN kembar di berkas');else{seen.add(o.nisn);const e=S.db.anggota.find(a=>String(a.nisn)===o.nisn);if(e){it.st='ada';it.eid=e.id}const jk=normJK(o.jk);if(jk===null)bad('jenis kelamin tidak dikenali');else o.jk=jk;const tg=parseDate(o.tgl);if(tg===null)bad('tanggal lahir salah');else o.tgl=tg}}
      else if(type==='kelas'||type==='kategori'){const kk=o.nama.toLowerCase();if(seen.has(kk))bad('nama kembar di berkas');else{seen.add(kk);const e=S.db[type].find(x=>x.nama.toLowerCase()===kk);if(e){it.st='ada';it.eid=e.id}}}
      else{const a=S.db.anggota.find(x=>String(x.nisn)===o.nisn),b=S.db.buku.find(x=>x.kode.toLowerCase()===o.kode.toLowerCase());
        if(!a)bad('NISN belum terdaftar');else if(!b)bad('kode buku belum terdaftar');else{const t1=parseDate(o.tglPinjam),t2=o.tenggat?parseDate(o.tenggat):addDays(t1||today(),+set().hari||7),t3=parseDate(o.tglKembali);
          if(!t1)bad('tanggal pinjam salah');else if(t2===null)bad('tenggat salah');else if(t3===null)bad('tanggal kembali salah');else{o.tglPinjam=t1;o.tenggat=t2;o.tglKembali=t3||'';it.a=a;it.b=b;const e=S.db.pinjaman.find(p=>p.anggotaId===a.id&&p.bukuId===b.id&&p.tglPinjam===t1);if(e){it.st='ada';it.eid=e.id}
            else if(!o.tglKembali&&lo.has(b.id)&&!seen.has('b'+b.id))bad('buku sedang dipinjam orang lain');if(!o.tglKembali&&it.st==='baru')seen.add('b'+b.id)}}}
      items.push(it)});
    S.imp={type,items,mode:'lewati',file:file.name};impPreview()}catch(e){toast(e.message||'Gagal membaca berkas','err')}}
function impPreview(){const I=S.imp,cfg=IMP[I.type],c={baru:0,ada:0,salah:0};I.items.forEach(x=>c[x.st]++);const bad=I.items.filter(x=>x.st==='salah');

async function impGo(){const I=S.imp,t=I.type,upd=I.mode==='perbarui';let nb=0,nu=0;const btn=$('[data-act=imgo]');btn.disabled=true;btn.textContent='Mengimpor…';

      else if(t==='anggota')r={id:it.eid||uid(),nisn:o.nisn,nama:o.nama,kelasId:await ensureName('kelas',o.kelas),tempat:o.tempat,tgl:o.tgl,jk:o.jk};
      else if(t==='kelas'||t==='kategori')r={id:it.eid||uid(),nama:o.nama};
      else r={id:it.eid||uid(),bukuId:it.b.id,anggotaId:it.a.id,tglPinjam:o.tglPinjam,tenggat:o.tenggat,tglKembali:o.tglKembali,petugas:S.user.nama};

  }catch(e){toast(fbErr(e),'err');btn.disabled=false;btn.textContent='Impor sekarang'}}

function idForm(){const s=set();modal('Identitas Sekolah',`<form id="frm"><label class="fl"><span>Nama sekolah / perpustakaan <b class="rq">*</b></span><input name="nama" required value="${esc(s.nama)}"></label><label class="fl"><span>Alamat</span><input name="alamat" value="${esc(s.alamat)}"></label><label class="fl"><span>Kepala perpustakaan</span><input name="kepala" value="${esc(s.kepala)}"></label><label class="fl"><span>Lama pinjam (hari)</span><input name="hari" type="number" min="1" max="60" value="${+s.hari||7}"></label><label class="fl"><span>Logo (PNG, JPG, atau WebP)</span><input type="file" id="lgf" accept="image/png,image/jpeg,image/webp"></label><div class="row"><img id="lgp" src="${esc(logo())}" alt="" style="width:64px;height:64px;object-fit:contain;border:1px solid var(--bd);border-radius:10px"><button type="button" class="btn sm" id="lgd">Pakai logo bawaan</button></div><div class="df mt"><button type="button" class="btn" data-act="close">Batal</button><button class="btn pri">Simpan</button></div></form>`);
  let lg=s.logo||'';$('#lgf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);lg=c.toDataURL('image/png');$('#lgp').src=lg};im.onerror=()=>toast('Gambar tidak bisa dibaca','err');im.src=r.result};r.readAsDataURL(f)};
  $('#lgd').onclick=()=>{lg='';$('#lgp').src=DEFAULT_LOGO};
  $('#frm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await saveSet({nama:d.nama.trim(),alamat:d.alamat.trim(),kepala:d.kepala.trim(),hari:Math.max(1,+d.hari||7),logo:lg,diatur:true});await log('Ubah','Identitas sekolah');closeModal();$('#blogo').src=logo();$('#bnama').textContent=set().nama;go('admin')}catch(er){toast(fbErr(er),'err')}}}
function petForm(o){const f=USE_FB?[{k:'nama',l:'Nama petugas',r:1},{k:'email',l:'Email akun login',t:'email'}]:[{k:'nama',l:'Nama petugas',r:1},{k:'pin',l:'PIN 4–8 angka (kosongkan jika tanpa PIN)',m:8}];
  formModal(o?'Ubah Petugas':'Tambah Petugas',f,o?{...o,pin:''}:{},async d=>{const r={id:o?o.id:uid(),nama:d.nama.trim()};if(USE_FB)r.email=(d.email||'').trim();else{if(d.pin&&!/^\d{4,8}$/.test(d.pin))throw new Error('PIN harus 4–8 angka');r.pin=d.pin?hash(d.pin):(o?o.pin:'')}await put('petugas',r);await log(o?'Ubah':'Tambah','Petugas: '+r.nama);go('admin')})}
function backup(){const d=JSON.parse(JSON.stringify(S.db));download('cadangan-pustaka-'+today()+'.json',JSON.stringify({app:'pustaka',v:1,tgl:new Date().toISOString(),data:d}),'application/json');localStorage.setItem('pustaka_lastbackup',String(Date.now()));toast('Cadangan diunduh','ok');if(S.page==='dashboard')go('dashboard')}
async function restore(file){try{const j=JSON.parse(await file.text());if(j.app!=='pustaka'||!j.data)throw new Error('Berkas bukan cadangan Pustaka');if(!confirm('Pulihkan data dari berkas ini? Data dengan ID yang sama akan ditimpa.'))return;
  for(const c of COLS)if(Array.isArray(j.data[c]))await putMany(c,j.data[c]);if(j.data.set)await saveSet(j.data.set);toast('Data dipulihkan','ok');await log('Pulihkan','dari '+file.name);go('admin')}catch(e){toast(e.message||'Gagal memulihkan','err')}}
async function sample(){if(S.db.buku.length||S.db.anggota.length){if(!confirm('Data sudah ada. Tambahkan data contoh di atasnya?'))return}
  const kl=['Kelas 1','Kelas 2','Kelas 3','Kelas 4','Kelas 5','Kelas 6'].map(n=>S.db.kelas.find(k=>k.nama===n)||{id:uid(),nama:n}),kt=['Cerita Anak','Pengetahuan Umum','Pelajaran','Agama'].map(n=>S.db.kategori.find(k=>k.nama===n)||{id:uid(),nama:n});
  await putMany('kelas',kl);await putMany('kategori',kt);
  const B=[['Si Kancil dan Buaya','Cerita Rakyat',0,0],['Ensiklopedia Hewan','Tim Penulis',2,1],['Belajar Membaca','Tim Penulis',0,2],['Matematika Seru','Tim Penulis',3,2],['Kisah Nabi','Tim Penulis',4,3],['IPA untuk Kelas 5','Tim Penulis',4,2],['Dongeng Nusantara','Cerita Rakyat',1,0],['Atlas Dunia Anak','Tim Penulis',5,1]].map((b,i)=>({id:uid(),kode:'SMP'+String(i+1).padStart(3,'0'),inv:String(i+1).padStart(3,'0')+'/INV/'+new Date().getFullYear(),judul:b[0],pengarang:b[1],tahun:'2023',kelasId:kl[b[2]].id,kategoriId:kt[b[3]].id}));
  const N=[['Contoh Siswa Satu','Laki-Laki'],['Contoh Siswa Dua','Perempuan'],['Contoh Siswa Tiga','Laki-Laki'],['Contoh Siswa Empat','Perempuan'],['Contoh Siswa Lima','Perempuan'],['Contoh Siswa Enam','Laki-Laki']];
  const A=N.map((n,i)=>({id:uid(),nisn:'900000000'+(i+1),nama:n[0],kelasId:kl[i].id,tempat:'Kota Contoh',tgl:(2016-i%3)+'-0'+(i+1)+'-15',jk:n[1]}));
  await putMany('buku',B);await putMany('anggota',A);
  const P=[];const t=today();[[0,0,2,1],[1,1,5,0],[2,2,9,1],[3,3,14,0],[4,4,20,1],[5,5,3,0],[0,6,35,0],[1,7,45,0]].forEach(([a,b,ago,ret],i)=>{const d=addDays(t,-ago);P.push({id:uid(),bukuId:B[b].id,anggotaId:A[a].id,tglPinjam:d,tenggat:addDays(d,7),tglKembali:ret?'':(ago>9?addDays(d,6):''),petugas:S.user.nama})});
  P[0].tglKembali='';await putMany('pinjaman',P);await log('Impor','Data contoh dimuat');toast('Data contoh dimuat','ok');go(S.page)}
async function wipe(){const w=prompt('Ini menghapus SEMUA buku, anggota, kelas, kategori, dan pinjaman. Ketik HAPUS untuk melanjutkan.');if(w!=='HAPUS')return;for(const c of ['pinjaman','buku','anggota','kelas','kategori'])await delAll(c);await log('Hapus','Semua data dikosongkan');toast('Data dikosongkan','ok');go(S.page)}

/* ========== PWA ========== */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
async function pwaCheck(){const rows=[];const add=(ok,t,h)=>rows.push(`<div class="chk"><i style="color:${ok?'#16a34a':'#dc2626'}">${ok?'✓':'✗'}</i><div>${t}${!ok&&h?`<div class="muted small">${h}</div>`:''}</div></div>`);
  add(location.protocol==='https:'||location.hostname==='localhost','Alamat https','Buka lewat alamat GitHub Pages (https).');
  let mj=null;try{const r=await fetch('manifest.json',{cache:'no-store'});add(r.ok,'manifest.json ditemukan','Unggah manifest.json ke folder yang sama dengan index.html.');if(r.ok)mj=await r.json()}catch(e){add(false,'manifest.json ditemukan','Unggah manifest.json ke folder yang sama dengan index.html.')}
  try{const r=await fetch('sw.js',{cache:'no-store'});add(r.ok,'sw.js ditemukan','Unggah sw.js ke folder yang sama dengan index.html.')}catch(e){add(false,'sw.js ditemukan','Unggah sw.js ke folder yang sama dengan index.html.')}
  for(const n of ['icon-192.png','icon-512.png','maskable-512.png']){try{const r=await fetch(n,{cache:'no-store'});add(r.ok,n+' ditemukan','Unggah '+n+' ke folder yang sama (kode 404 berarti salah letak).')}catch(e){add(false,n+' ditemukan','Unggah '+n+' ke folder yang sama.')}}
  let sw=false;try{sw=!!(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration())}catch(e){}add(sw,'Service worker aktif','Muat ulang halaman sekali lalu periksa lagi.');
  modal('Pemeriksaan pemasangan',rows.join('')+`<p class="muted small">Jika semuanya ✓ tetapi tawaran pasang belum muncul, tutup Chrome sepenuhnya, buka lagi, tunggu beberapa detik. Pembaruan: tutup dan buka aplikasi dua kali.</p>`)}
function initPWA(){if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  const b=$('#pwabtn');if(matchMedia('(display-mode:standalone)').matches||navigator.standalone)return;b.hidden=false;b.innerHTML=ICON('download',14)+' Pasang di HP';b.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else pwaCheck()}}
window.addEventListener('appinstalled',()=>{$('#pwabtn').hidden=true;toast('Aplikasi terpasang','ok')});

/* ========== penghubung aksi ========== */
const ACT={
 close:closeModal,
 go:(d)=>go(d.p),
 menu:()=>{$('#side').classList.toggle('open');if($('#side').classList.contains('open')){const s=document.createElement('div');s.id='shade';s.dataset.act='menu';document.body.appendChild(s)}else $('#shade')&&$('#shade').remove()},
 theme:()=>{const n=dark()?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('pustaka_theme',n);$('[data-act=theme]').innerHTML=ICON(n==='dark'?'sun':'moon');go(S.page)},
 logout,pg:d=>{S.ps[d.k].p=+d.p;go(S.page)},
 sadd:d=>nameForm(d.c),sedit:d=>nameForm(d.c,S.db[d.c].find(x=>x.id===d.id)),
 sdel:async d=>{const o=S.db[d.c].find(x=>x.id===d.id);const used=d.c==='kelas'?S.db.buku.some(b=>b.kelasId===o.id)||S.db.anggota.some(a=>a.kelasId===o.id):S.db.buku.some(b=>b.kategoriId===o.id);if(used)return toast('Tidak bisa dihapus: masih dipakai buku/anggota','err');if(!confirm('Hapus "'+o.nama+'"?'))return;await del(d.c,o.id);await log('Hapus',d.c+': '+o.nama);go(S.page)},
 badd:()=>bukuForm(),bedit:d=>bukuForm(bukuBy(d.id)),
 bdel:async d=>{const b=bukuBy(d.id);if(activeLoans().has(b.id))return toast('Buku sedang dipinjam','err');if(!confirm('Hapus buku "'+b.judul+'"?'))return;await del('buku',b.id);await log('Hapus','Buku: '+b.kode+' '+b.judul);go(S.page)},
 bprint:()=>printHTML('Daftar Buku',tbl(['No','Kode','No. Inventaris','Judul','Pengarang','Tahun','Kelas','Kategori','QR'],bukuFiltered().map((b,i)=>`<tr><td>${i+1}</td><td>${esc(b.kode)}</td><td>${esc(b.inv||'')}</td><td>${esc(b.judul)}</td><td>${esc(b.pengarang||'')}</td><td>${esc(b.tahun||'')}</td><td>${esc(kn(b.kelasId))}</td><td>${esc(cn(b.kategoriId))}</td><td>${qrImg(b.kode)}</td></tr>`).join(''))),
 aadd:()=>angForm(),aedit:d=>angForm(angBy(d.id)),
 adel:async d=>{const a=angBy(d.id);if(S.db.pinjaman.some(p=>p.anggotaId===a.id&&!p.tglKembali))return toast('Anggota masih punya pinjaman aktif','err');if(!confirm('Hapus anggota "'+a.nama+'"?'))return;await del('anggota',a.id);await log('Hapus','Anggota: '+a.nisn+' '+a.nama);go(S.page)},
 akartu:d=>{const a=angBy(d.id);modal('Kartu Anggota',cardHTML(a)+`<div class="row mt" style="justify-content:center"><button class="btn pri" data-act="kpng" data-id="${a.id}">${ICON('download',15)} Unduh PNG</button><button class="btn" data-act="kprint1" data-id="${a.id}">${ICON('print',15)} Cetak</button></div>`,true)},
 kpng:async d=>{const a=angBy(d.id),b=await cardPNG(a);download('kartu-'+a.nisn+'.png',b)},
 kprint1:d=>printHTML('Kartu Anggota',cardsHTML([angBy(d.id)])),
 aprint:()=>printHTML('Daftar Anggota',tbl(['No','NISN','Nama','Kelas','Tempat, Tanggal Lahir','Jenis Kelamin'],angFiltered().map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.nisn)}</td><td>${esc(a.nama)}</td><td>${esc(kn(a.kelasId))}</td><td>${esc([a.tempat,fmt(a.tgl)].filter(x=>x&&x!=='–').join(', '))}</td><td>${esc(a.jk||'')}</td></tr>`).join(''))),
 akprint:()=>{const l=angFiltered();if(!l.length)return toast('Tidak ada anggota untuk dicetak','err');if(l.length>100&&!confirm('Mencetak '+l.length+' kartu sekaligus. Disarankan per kelas. Lanjutkan?'))return;printHTML('Kartu Anggota',cardsHTML(l))},
 padd:()=>pinForm(),
 kembali:async d=>{await kembalikan(d.id);go(S.page)},
 pdel:async d=>{if(!confirm('Hapus data peminjaman ini?'))return;await del('pinjaman',d.id);await log('Hapus','Data pinjaman');go(S.page)},
 cam:()=>cam?stopCam():startCam(),
 sreset:()=>{S.scan={a:null,b:null};scanRes();$('#scin').focus()},
 spinjam:async()=>{try{await pinjam(angBy(S.scan.a),bukuBy(S.scan.b));S.scan={a:null,b:null};scanRes()}catch(e){toast(e.message,'err')}},
 skembali:async d=>{await kembalikan(d.id);S.scan={a:null,b:null};scanRes()},
 lcsv:()=>exportRows('laporan-'+S.ps.lap.from+'_'+S.ps.lap.to,lapRows(),false),lxls:()=>exportRows('laporan-'+S.ps.lap.from+'_'+S.ps.lap.to,lapRows(),true),
 lprint:()=>{const r=lapRows();printHTML('Laporan Peminjaman '+fmt(S.ps.lap.from)+' s/d '+fmt(S.ps.lap.to),tbl(r[0],r.slice(1).map(x=>`<tr>${x.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')))},
 imp:d=>{S.imp={type:d.t};go('impor')},
 imgo:impGo,imcancel:()=>{S.imp={type:S.imp.type};$('#imprev').innerHTML=''},
 tplx:()=>template($('#imtype').value,true),tplc:()=>template($('#imtype').value,false),
 idedit:idForm,padd2:()=>petForm(),ptedit:d=>petForm(S.db.petugas.find(x=>x.id===d.id)),
 ptdel:async d=>{if(S.db.petugas.length<2&&!USE_FB)return toast('Sisakan minimal satu petugas','err');const p=S.db.petugas.find(x=>x.id===d.id);if(!confirm('Hapus petugas "'+p.nama+'"?'))return;await del('petugas',p.id);go('admin')},
 backup,restore:()=>{const f=$('#rfile');f.onchange=()=>f.files[0]&&restore(f.files[0]);f.click()},
 sample,wipe,pwacheck:pwaCheck
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.classList.contains('ov'))return;const f=ACT[t.dataset.act];if(f){Promise.resolve(f(t.dataset,t,e)).catch(er=>{console.error(er);toast(fbErr(er),'err')})}});
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('ov'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q){S.ps[t.dataset.q].q=t.value;S.ps[t.dataset.q].p=1;const L={buku:bukuList,anggota:angList,pinjaman:pinList}[t.dataset.q];$('#list').innerHTML=L()}
  if(t.dataset.lap){S.ps.lap[t.dataset.lap]=t.value;$('#list').innerHTML=lapBody()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){const[p,k]=t.dataset.f.split(':');S.ps[p][k]=t.value;if(S.ps[p].p!==undefined)S.ps[p].p=1;go(S.page)}});
if(matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){let cur=null;
  document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('.tilt');if(cur&&cur!==t){cur.style.transform='';cur=null}if(!t||t.classList.contains('hero')&&false)return;cur=t;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(800px) rotateX(${(-y*7).toFixed(2)}deg) rotateY(${(x*9).toFixed(2)}deg)`;t.style.setProperty('--gx',(x+.5)*100+'%');t.style.setProperty('--gy',(y+.5)*100+'%')});
  document.addEventListener('mouseleave',()=>{if(cur){cur.style.transform='';cur=null}})}

/* ========== Firebase ========== */
function bootFB(){
  ensure('fb1').then(()=>Promise.all([ensure('fb2'),ensure('fb3')])).then(()=>{
    firebase.initializeApp(FBC);S.auth=firebase.auth();S.fs=firebase.firestore();
    try{S.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
    S.auth.onAuthStateChanged(u=>{if(u)startFB(u);else{(S.unsub||[]).forEach(f=>f());S.unsub=[];S.user=null;showLogin()}})
  }).catch(e=>{toast(e.message,'err');showLogin()})}
function startFB(u){(S.unsub||[]).forEach(f=>f());S.unsub=[];let ready=false;const want=new Set([...COLS,'meta']);const got=new Set();
  const check=k=>{got.add(k);if(!ready&&got.size>=want.size){ready=true;setUser();enter()}else if(ready){setUser();refresh()}};
  const setUser=()=>{const p=S.db.petugas.find(x=>(x.email||'').toLowerCase()===(u.email||'').toLowerCase());S.user={id:u.uid,nama:p?p.nama:u.email};if(ready){$('#usr').innerHTML=ICON('users',14)+' '+esc(S.user.nama);$('#blogo').src=logo();$('#bnama').textContent=set().nama}};
  const err=e=>{toast(fbErr(e),'err')};
  COLS.forEach(c=>{let q=S.fs.collection(c);if(c==='riwayat')q=q.orderBy('waktu','desc').limit(500);S.unsub.push(q.onSnapshot(s=>{S.db[c]=s.docs.map(d=>d.data());check(c)},e=>{err(e);check(c)}))});
  S.unsub.push(S.fs.collection('meta').doc('sekolah').onSnapshot(s=>{if(s.exists)S.db.set=s.data();defaults();check('meta')},e=>{err(e);check('meta')}))}

/* ========== mulai ========== */
(function init(){
  const th=localStorage.getItem('pustaka_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th;
  ensure('qr').catch(()=>{});initPWA();
  if(USE_FB){defaults();bootFB()}
  else{loadLocal();defaults();const uid0=sessionStorage.getItem('pustaka_u'),p=S.db.petugas.find(x=>x.id===uid0);if(p){S.user=p;enter()}else showLogin()}
})();
</script>
